<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Mr K Burgers POS</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#111;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}

button,input{font:inherit}

button{cursor:pointer;border:1px solid #444;background:#252525;color:white;border-radius:12px;padding:15px 20px}

.primary{background:#f3a51b;color:#111;border-color:#f3a51b;font-weight:bold}

.secondary{background:#252525;color:white;border-color:#555;font-weight:bold}

.danger{background:#351b1b;border-color:#703434;color:#ffb0b0}

.green{background:#17351e;border-color:#397548;color:#b8ffc8;font-weight:bold}

.app{min-height:100vh;padding:24px;max-width:1100px;margin:auto}

.logo{font-size:28px;font-weight:800}

.logo span{display:block;color:#f3a51b;font-size:11px;letter-spacing:3px;margin-top:4px}

.panel{background:#1b1b1b;border:1px solid #373737;border-radius:16px;padding:20px;margin-top:18px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}

.card{background:#242424;border:1px solid #373737;border-radius:14px;padding:20px}

.clickable{cursor:pointer;transition:.15s}

.clickable:active{transform:scale(.98)}

.category{min-height:150px;text-align:left}

.category-icon{font-size:38px;margin-bottom:12px}

.form{display:grid;gap:12px;max-width:550px}

input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:white}

.muted{color:#aaa}

.badge{color:#f3a51b;font-size:11px;font-weight:bold;letter-spacing:1px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}

.loginbox{width:min(430px,100%);background:#191919;border:1px solid #373737;border-radius:18px;padding:30px}

.back{margin-bottom:20px}

.qty{display:flex;align-items:center;gap:15px}

.qty button{width:48px;height:48px;padding:0;font-size:24px}

.qty strong{min-width:30px;text-align:center;font-size:24px}

.extra-row{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#202020;border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:10px 0}

.extra-name{flex:1;font-weight:bold}

.extra-qty{display:flex;align-items:center;gap:10px}

.extra-qty button{width:42px;height:42px;padding:0;font-size:22px}

.extra-qty strong{min-width:28px;text-align:center;font-size:20px}

.ingredient-row{display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:8px 0}

.ingredient-row input{width:22px;height:22px;accent-color:#f3a51b;flex:0 0 auto}

.ingredient-row label{font-weight:bold;flex:1}

.no-item{color:#ff9b9b;font-weight:bold;margin-top:5px}

.summary{background:#101010;border:1px solid #3b3b3b;border-radius:14px;padding:18px;margin-top:18px}

.order-card{background:#202020;border:1px solid #3b3b3b;border-radius:16px;padding:18px;margin:14px 0}

.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}

.order-number{font-size:22px;font-weight:bold}

.timer{font-size:24px;font-weight:800;color:#f3a51b;font-variant-numeric:tabular-nums}

.status{display:inline-block;background:#302715;border:1px solid #6c5220;color:#f3a51b;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}

.status.ready{background:#17351e;border-color:#397548;color:#b8ffc8}

.status.completed{background:#252525;border-color:#555;color:#bbb}

.draft-status{display:inline-block;background:#1c2730;border:1px solid #3e6176;color:#8ccdf3;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}

.info-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #333}

.info-row:last-child{border-bottom:none}

.system-note{border-left:4px solid #f3a51b;padding:12px 14px;background:#181818;margin-top:12px;color:#bbb}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}

.actions button{flex:1;min-width:150px}

.cart-count{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#f3a51b;color:#111;font-size:11px;font-weight:bold}

.kitchen-title{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}

.kitchen-item{font-size:18px;font-weight:bold;padding:10px 0;border-bottom:1px solid #333}

.kitchen-item:last-child{border-bottom:none}

@media(max-width:700px){

  .app{padding:16px}

  .grid{grid-template-columns:1fr}

  .order-top{flex-direction:column}

}

</style>

function safeLoad(key,fallback){

 try{

   const raw=localStorage.getItem(key);

   if(raw===null)return fallback;

   return JSON.parse(raw);

 }catch(e){

   return fallback;

 }

}

function esc(v){

 return String(v||"")

 .replace(/&/g,"&amp;")

 .replace(/"/g,"&quot;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;");

}

function padOrder(n){

 return String(n).padStart(3,"0");

}

function orderCart(o){

 if(Array.isArray(o.cart))return o.cart;

 if(Array.isArray(o.items))return o.items;

 return [];

}
function orderTotal(o){

 if(Number.isFinite(Number(o.total))){

  return Number(o.total);

 }

 return orderCart(o).reduce(

  (sum,item)=>sum+itemLineTotal(item),

  0

 );

function orderLabel(o){

 if(o.type==="DINE IN"){

   if(o.customer&&o.customer.table)return `Table ${o.customer.table}`;

 return o.customer?.name||o.type||"Order";

function formatDateTime(timestamp){

 try{

function prepDuration(o){

function managerSales(){

 const today=new Date();

const orders=completedOrders.filter(o=>{

 if(!o.completedAt)return false;

 const dt=new Date(Number(o.completedAt));

 return (

  dt.getFullYear()===today.getFullYear() &&

  dt.getMonth()===today.getMonth() &&

  dt.getDate()===today.getDate()

 );

});

 const totalSales=orders.reduce(

  (sum,o)=>sum+orderTotal(o),

  0

 );

 const totalOrders=orders.length;

 const averageOrder=

  totalOrders

   ?Math.round(totalSales/totalOrders)

   :0;
const dineInOrders=orders.filter(o=>o.type==="DINE IN");

const takeawayOrders=orders.filter(o=>o.type==="TAKEAWAY");

const dineInSales=dineInOrders.reduce(

 (sum,o)=>sum+orderTotal(o),

 0

);

const takeawaySales=takeawayOrders.reduce(

 (sum,o)=>sum+orderTotal(o),

 0

);
  const deliveryOrders=orders.filter(o=>o.type==="DELIVERY");

const deliverySales=deliveryOrders.reduce(

 (sum,o)=>sum+orderTotal(o),

 0

);

function managerSalesHistory(selectedDate){

 if(!selectedDate){

 const today=new Date();

 const y=today.getFullYear();

 const m=String(today.getMonth()+1).padStart(2,"0");

 const d=String(today.getDate()).padStart(2,"0");

 selectedDate=`${y}-${m}-${d}`;

}

 const orders=completedOrders.filter(o=>{

  if(!o.completedAt)return false;

  const dt=new Date(Number(o.completedAt));

  const oy=dt.getFullYear();

  const om=String(dt.getMonth()+1).padStart(2,"0");

  const od=String(dt.getDate()).padStart(2,"0");

  return `${oy}-${om}-${od}`===selectedDate;

 });

 const totalSales=orders.reduce(

  (sum,o)=>sum+orderTotal(o),

  0

 );
 const dineInOrders=orders.filter(o=>o.type==="DINE IN");

const takeawayOrders=orders.filter(o=>o.type==="TAKEAWAY");

const deliveryOrders=orders.filter(o=>o.type==="DELIVERY");

const dineInSales=dineInOrders.reduce(

 (sum,o)=>sum+orderTotal(o),

 0

);

const takeawaySales=takeawayOrders.reduce(

 (sum,o)=>sum+orderTotal(o),

 0

);

const deliverySales=deliveryOrders.reduce(

);

function managerOrderCard(o){

 const items=orderCart(o);

 return `

 <div class="order-card">

  <div class="order-top">

   <div>

    <div class="order-number">

     #${padOrder(o.number)}

    </div>

    <h2>

     ${esc(orderLabel(o))}

    </h2>

    <span class="muted">

     ${esc(o.type)}

    </span>

   </div>

   <div style="text-align:right">

    <div

     class="timer"

     data-start="${o.startedAt||Date.now()}"

     data-stop="${o.readyAt||""}">

     ${

      formatTimer(

       o.startedAt||Date.now(),

       o.readyAt

      )

     }

    </div>

    <span

     class="status ${o.status==="READY"?"ready":""}">

     ${esc(o.status||"NEW")}

    </span>

   </div>

  </div>

  <div class="summary">

   ${

    items.length

    ?items.map(i=>`

     <div class="kitchen-item">

      ${i.qty} × ${esc(i.name)}

      ${removedHtml(i)}

      ${

       (i.extras||[])

       .map(e=>`

        <div class="muted">

         ${e.qty} × ${esc(e.name)}

        </div>

       `)

       .join("")

      }

     </div>

    `).join("")

    :`<p class="muted">No item details available.</p>`

   }

  </div>

 </div>`;

}

 const m=String(today.getMonth()+1).padStart(2,"0");

 const orders=

 [...completedOrders]

 const d=String(date.getDate()).padStart(2,"0");

})

 const lowItems=

  inventoryItems

  .map(item=>({

   ...item,

   current:

    Number(inventoryStock[item.id]||0),

   threshold:

    Number(lowStockThresholds[item.id]||0)

  }))

  .filter(

   item=>

    item.current<=item.threshold

  )

  .sort(

   (a,b)=>

    (a.current-a.threshold)-

    (b.current-b.threshold)

  );

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="managerInventory()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>MANAGER — LOW STOCK</span>

  </div>

  <div class="panel">

   <span class="badge">

    ⚠️ LOW STOCK

   </span>

   <h1>Low Stock Items</h1>

   <p class="muted">

    Items at or below their minimum stock level.

   </p>

   ${

    lowItems.length

    ?lowItems.map(item=>`

     <div class="order-card">

      <div class="order-top">

       <div>

        <h3>${esc(item.name)}</h3>

        <span class="muted">

         Low-stock level: ${item.threshold}

        </span>

       </div>

       <div style="text-align:right">

        <div class="order-number">

         ${item.current}

        </div>

        <span class="muted">

         IN STOCK

        </span>

       </div>

      </div>

     </div>

    `).join("")

    :`

     <div class="system-note">

 </div>`;

}

function showOrderHistory(){

const todayY=today.getFullYear();

const todayM=today.getMonth();

const todayD=today.getDate();
 const history=[...completedOrders]
.filter(o=>{

 if(!o.completedAt)return false;

 const date=new Date(Number(o.completedAt));

 return date.getFullYear()===todayY &&

        date.getMonth()===todayM &&

        date.getDate()===todayD;

})
 .sort((a,b)=>Number(b.completedAt||0)-Number(a.completedAt||0));

/* CUSTOMIZATION */

function resetExtras(extras){

 currentExtraQty={};

 extras.forEach(e=>{

   currentExtraQty[e]=0;

 });

}

function resetIngredients(){

 currentRemovedIngredients=[];

}

function safeId(t){

 return "x"+t.replace(/[^a-zA-Z0-9]/g,"");

}

function ingredientId(i){

 return "ing"+i;

}

function ingredientRows(ingredients){

 return ingredients.map((ingredient,index)=>`

 <div class="ingredient-row">

  <input

   type="checkbox"

   id="${ingredientId(index)}"

   checked

   onchange='toggleIngredient(${JSON.stringify(ingredient)},this.checked)'>

  <label for="${ingredientId(index)}">

   ${esc(ingredient)}

  </label>

 </div>`).join("");

}

function toggleIngredient(ingredient,isChecked){

 if(isChecked){

   currentRemovedIngredients=

   currentRemovedIngredients.filter(

     x=>x!==ingredient

   );

 }else{

   if(!currentRemovedIngredients.includes(ingredient)){

     currentRemovedIngredients.push(ingredient);

   }

 }

}

function extraInventoryId(e){

 const map={

  "Extra beef patty":"beef120",

  "Extra chicken steak":"chicken120",

  "Extra cheddar cheese":"cheddar",

  "Extra mozzarella cheese":"mozzarella",

  "Extra Swiss cheese":"emmental",

  "Extra mushroom":"mushroom",

  "Extra bacon":"bacon",

  "Extra grated cheese":"gratedCheese"

 };

 return map[e]||null;

}

function extraRows(extras){

 return extras.map(e=>{

  const id=

   extraInventoryId(e);

  const current=

   Number(currentExtraQty[e]||0);

  const testExtras=

   Object.entries(currentExtraQty)

   .map(([name,qty])=>({

    name,

    qty:

     name===e

     ?current+1

     :Number(qty||0)

   }))

   .filter(extra=>extra.qty>0);

  const needs=

   getOrderInventoryNeeds({

    cart:[{

     name:currentCustomizeItem,

     qty:Number(currentQty||1),

     extras:testExtras,

     removed:[

      ...currentRemovedIngredients

     ]

    }]

   });

  const outOfStock=

   id

   ?Number(needs[id]||0)>

     Number(inventoryStock[id]||0)

   :false;

  return `

 <div class="extra-row">

  <div class="extra-name">

   ${e}

   ${

    outOfStock

    ?`<div class="muted" style="font-weight:800">

       OUT OF STOCK

      </div>`

    :""

   }

  </div>

  <div class="extra-qty">

   <button

    onclick='changeExtraQty(${JSON.stringify(e)},-1)'>

    −

   </button>

   <strong id="${safeId(e)}">

    ${currentExtraQty[e]||0}

   </strong>

   <button

    ${outOfStock?"disabled":""}

    onclick='changeExtraQty(${JSON.stringify(e)},1)'>

    +

   </button>

  </div>

 </div>`;

 }).join("");

}

function changeExtraQty(e,n){

 const current=

  Number(currentExtraQty[e]||0);

 const next=

  Math.max(0,current+n);

 if(n>0){

  const testExtras=

   Object.entries(currentExtraQty)

   .map(([name,qty])=>({

    name,

    qty:

     name===e

     ?next

     :Number(qty||0)

   }))

   .filter(extra=>extra.qty>0);

  const missing=

   checkOrderInventory({

    cart:[{

     name:currentCustomizeItem,

     qty:Number(currentQty||1),

     extras:testExtras,

     removed:[

      ...currentRemovedIngredients

     ]

    }]

   });

  if(missing.length){

   return alert(

    "NOT ENOUGH STOCK\n\n"+

    missing.join("\n")

   );

  }

 }

 currentExtraQty[e]=next;

 const el=

  document.getElementById(

   safeId(e)

  );

 if(el){

  el.textContent=

   currentExtraQty[e];

 }

}

/* CART */

function removedHtml(i){

 return (i.removed||[])

 .map(r=>`

  <div class="no-item">

   NO ${esc(String(r).toUpperCase())}

 `)

 .join("");

}
function itemUnitPrice(item){

 let total=

 Number(menuPrices[item.name]||0);

 (item.extras||[]).forEach(extra=>{

  total+=

   Number(menuPrices[extra.name]||0)*

   Number(extra.qty||0);

 });

 return total;

}

function itemLineTotal(item){

 return (

  itemUnitPrice(item)*

  Number(item.qty||1)

 );

}

function cartTotal(){

 return cart.reduce(

  (sum,item)=>sum+itemLineTotal(item),

  0

 );

}

 );

});

 const ix=

 activeOrders.findIndex(

   x=>

   Number(x.number)===

   Number(number)

 );

 if(ix<0){

 const o=

 activeOrders[ix];

 if(o.status!=="READY"){

   return alert(

     "Kitchen must mark the order READY first."

   );

 }

 o.status="COMPLETED";

 o.completedAt=Date.now();

 completedOrders.push(o);

 activeOrders.splice(ix,1);

 saveOrders();

 home();

}

/* TIMER */

function formatTimer(startedAt,stopAt){

 const start=

 Number(startedAt)||

 Date.now();

 const end=

 stopAt

 ?Number(stopAt)

 :Date.now();

 const seconds=

 Math.max(

   0,

   Math.floor(

     (end-start)/1000

   )

 );

 const h=

 Math.floor(seconds/3600);

 const m=

 Math.floor((seconds%3600)/60);

 const s=

 seconds%60;

 if(h>0){

   return `${

    String(h).padStart(2,"0")

   }:${

    String(m).padStart(2,"0")

   }:${

    String(s).padStart(2,"0")

   }`;

 }

 return `${

  String(m).padStart(2,"0")

 }:${

  String(s).padStart(2,"0")

 }`;

}

function updateVisibleTimers(){

 document

 .querySelectorAll(".timer")

 .forEach(el=>{

   el.textContent=

   formatTimer(

     el.dataset.start,

     el.dataset.stop||null

   );

 });

}

function startTimerRefresh(){

 clearInterval(timerInterval);

 updateVisibleTimers();

 timerInterval=

 setInterval(

   updateVisibleTimers,

   1000

 );

}
