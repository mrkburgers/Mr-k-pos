<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111111">

<title>Mr K Burgers POS</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#111;

  color:#f5f1e8;

  font-family:Arial,Helvetica,sans-serif;

}

button,input{

  font:inherit;

}

button{

  cursor:pointer;

  border:1px solid #444;

  background:#252525;

  color:white;

  border-radius:12px;

  padding:15px 20px;

}

.primary{

  background:#f3a51b;

  color:#111;

  border-color:#f3a51b;

  font-weight:bold;

}

.app{

  min-height:100vh;

  padding:24px;

  max-width:1100px;

  margin:auto;

}

.logo{

  font-size:28px;

  font-weight:800;

  letter-spacing:1px;

}

.logo span{

  display:block;

  color:#f3a51b;

  font-size:11px;

  letter-spacing:3px;

  margin-top:4px;

}

.panel{

  background:#1b1b1b;

  border:1px solid #373737;

  border-radius:16px;

  padding:20px;

  margin-top:18px;

}

.grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;

}

.card{

  background:#242424;

  border:1px solid #373737;

  border-radius:14px;

  padding:20px;

}

.card button{

  width:100%;

  margin-top:15px;

}

.category{

  min-height:160px;

  text-align:left;

  display:flex;

  flex-direction:column;

  justify-content:center;

}

.category h2{

  margin:8px 0;

}

.form{

  display:grid;

  gap:12px;

  max-width:550px;

}

input{

  width:100%;

  padding:14px;

  border-radius:10px;

  border:1px solid #444;

  background:#0d0d0d;

  color:white;

}

.muted{

  color:#aaa;

}

.badge{

  color:#f3a51b;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.login{

  min-height:100vh;

  display:grid;

  place-items:center;

  padding:20px;

}

.loginbox{

  width:min(430px,100%);

  background:#191919;

  border:1px solid #373737;

  border-radius:18px;

  padding:30px;

}

.back{

  margin-bottom:20px;

}

.option{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:14px;

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:12px;

  margin:10px 0;

}

.option input{

  width:22px;

  height:22px;

}

.qty{

  display:flex;

  align-items:center;

  gap:15px;

}

.qty button{

  width:48px;

  height:48px;

  padding:0;

  font-size:24px;

}

.qty strong{

  font-size:24px;

  min-width:30px;

  text-align:center;

}

.summary{

  background:#101010;

  border:1px solid #3b3b3b;

  border-radius:14px;

  padding:18px;

  margin-top:18px;

}

.notice{

  padding:12px;

  border-radius:10px;

  background:#2a210f;

  border:1px solid #6b5015;

  color:#f3a51b;

}

@media(max-width:700px){

  .app{

    padding:16px;

  }

  .grid{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div id="root"></div>

<script>

let loggedIn=false;

let orderType="";

let currentCategory="";

let cart=[];

let currentQty=1;

let customer={

  name:"",

  phone:"",

  address:""

};

/* =========================

   MENU

========================= */

const burgers=[

  "Mr K Classic",

  "Mushroom & Swiss",

  "Honky Tonk",

  "Philly Cheesesteak",

  "Only The Brave",

  "Bohemian",

  "Chicken Chimichurri"

];

const sides=[

  "French Fries",

  "Plantain Tostones",

  "Onion Rings",

  "Cheese Fries",

  "Fajita Cheese Fries",

  "Dirty Fries"

];

const salads=[

  "Mr K Coleslaw",

  "Cheeseburger Salad"

];

const drinks=[

  "Soft Drinks"

];

/* =========================

   BURGER INGREDIENTS

========================= */

const burgerDetails={

  "Mr K Classic":{

    ingredients:[

      "120g fresh beef steak",

      "Rocket lettuce (when available)",

      "Tomato",

      "Onions",

      "Pickled cucumbers",

      "Mr K sauce"

    ]

  },

  "Mushroom & Swiss":{

    ingredients:[

      "Fresh beef steak",

      "Mushrooms",

      "Swiss cheese"

    ]

  },

  "Honky Tonk":{

    ingredients:[

      "Fresh beef steak"

    ]

  },

  "Philly Cheesesteak":{

    ingredients:[

      "Fresh beef steak",

      "Cheesesteak-style toppings"

    ]

  },

  "Only The Brave":{

    ingredients:[

      "3 fresh beef patties"

    ]

  },

  "Bohemian":{

    ingredients:[

      "Fresh beef steak"

    ]

  },

  "Chicken Chimichurri":{

    ingredients:[

      "Chicken",

      "Chimichurri"

    ]

  }

};

/* =========================

   EXTRA SAUCES

========================= */

const extraSauces=[

  "Mr K sauce",

  "Chimichurri",

  "Ketchup",

  "Mayonnaise",

  "Honey Mustard",

  "Honey BBQ"

];

/* =========================

   START

========================= */

function render(){

  if(!loggedIn){

    loginPage();

    return;

  }

  home();

}

/* =========================

   LOGIN

========================= */

function loginPage(){

  document.getElementById("root").innerHTML=`

    <div class="login">

      <div class="loginbox">

        <div class="logo">

          MR K BURGERS

          <span>POS PROTOTYPE</span>

        </div>

        <div

          class="form"

          style="margin-top:30px"

        >

          <label>Cashier ID</label>

          <input

            id="user"

            value="cashier01"

          >

          <label>PIN</label>

          <input

            id="pin"

            type="password"

            value="1234"

          >

          <button

            class="primary"

            onclick="login()"

          >

            LOGIN

          </button>

          <p class="muted">

            Prototype login: cashier01 / 1234

          </p>

        </div>

      </div>

    </div>

  `;

}

function login(){

  const user=

    document.getElementById("user").value;

  const pin=

    document.getElementById("pin").value;

  if(

    user==="cashier01" &&

    pin==="1234"

  ){

    loggedIn=true;

    render();

  }else{

    alert(

      "Incorrect Cashier ID or PIN."

    );

  }

}

/* =========================

   HOME

========================= */

function home(){

  document.getElementById("root").innerHTML=`

    <div class="app">

      <div class="logo">

        MR K BURGERS

        <span>CASHIER POS</span>

      </div>

      <div class="panel">

        <h1>Cashier Home</h1>

        <p class="muted">

          Ready to take the next order.

        </p>

        <button

          class="primary"

          onclick="newOrder()"

        >

          ＋ NEW ORDER

        </button>

      </div>

      <div class="grid">

        <div class="card">

          <div class="badge">

            ACTIVE ORDERS

          </div>

          <h2>0</h2>

        </div>

        <div class="card">

          <div class="badge">

            TODAY'S ORDERS

          </div>

          <h2>0</h2>

        </div>

        <div class="card">

          <div class="badge">

            TODAY'S SALES

          </div>

          <h2>0 CFA</h2>

        </div>

      </div>

    </div>

  `;

}

/* =========================

   NEW ORDER

========================= */

function newOrder(){

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="home()"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>NEW ORDER</span>

      </div>

      <div class="panel">

        <h2>Choose Order Type</h2>

        <div class="grid">

          <button

            onclick="customerForm('Dine In')"

          >

            <h3>🍽️ DINE IN</h3>

            <span class="muted">

              Restaurant order

            </span>

          </button>

          <button

            onclick="customerForm('Takeaway')"

          >

            <h3>🥡 TAKEAWAY</h3>

            <span class="muted">

              Customer pickup

            </span>

          </button>

          <button

            onclick="customerForm('Delivery')"

          >

            <h3>🛵 DELIVERY</h3>

            <span class="muted">

              Delivery order

            </span>

          </button>

        </div>

      </div>

    </div>

  `;

}

/* =========================

   CUSTOMER

========================= */

function customerForm(type){

  orderType=type;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="newOrder()"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>

          ${type.toUpperCase()}

        </span>

      </div>

      <div class="panel">

        <h2>Customer</h2>

        <div class="form">

          <label>

            Customer Name

          </label>

          <input

            id="name"

            placeholder="Customer name"

          >

          <label>

            Phone

            ${

              type==="Delivery"

              ? "(required)"

              : "(optional)"

            }

          </label>

          <input

            id="phone"

            placeholder="+223 ..."

          >

          ${

            type==="Delivery"

            ?

            `

              <label>

                Delivery Address

              </label>

              <input

                id="address"

                placeholder="Delivery address"

              >

            `

            :

            ""

          }

          <button

            class="primary"

            onclick="goToCategories()"

          >

            CONTINUE TO MENU →

          </button>

        </div>

      </div>

    </div>

  `;

}

function goToCategories(){

  customer.name=

    document.getElementById("name")

    .value.trim();

  customer.phone=

    document.getElementById("phone")

    .value.trim();

  if(orderType==="Delivery"){

    customer.address=

      document.getElementById("address")

      .value.trim();

  }

  if(!customer.name){

    alert(

      "Please enter the customer's name."

    );

    return;

  }

  if(

    orderType==="Delivery" &&

    (!customer.phone || !customer.address)

  ){

    alert(

      "Delivery requires phone number and address."

    );

    return;

  }

  cart=[];

  categories();

}

/* =========================

   CATEGORIES

========================= */

function categories(){

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="customerForm(orderType)"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>MENU CATEGORIES</span>

      </div>

      <div class="panel">

        <h2>

          Choose a Category

        </h2>

        <div class="grid">

          <button

            class="category"

            onclick="showCategory('Burgers')"

          >

            <div class="badge">

              CATEGORY 01

            </div>

            <h2>

              🍔 Burgers

            </h2>

            <span class="muted">

              ${burgers.length} burgers

            </span>

          </button>

          <button

            class="category"

            onclick="showCategory('Sides')"

          >

            <div class="badge">

              CATEGORY 02

            </div>

            <h2>

              🍟 Sides

            </h2>

            <span class="muted">

              ${sides.length} sides

            </span>

          </button>

          <button

            class="category"

            onclick="showCategory('Salads')"

          >

            <div class="badge">

              CATEGORY 03

            </div>

            <h2>

              🥗 Salads

            </h2>

            <span class="muted">

              ${salads.length} salads

            </span>

          </button>

          <button

            class="category"

            onclick="showCategory('Soft Drinks')"

          >

            <div class="badge">

              CATEGORY 04

            </div>

            <h2>

              🥤 Soft Drinks

            </h2>

            <span class="muted">

              Drinks

            </span>

          </button>

        </div>

      </div>

      ${cartSummary()}

    </div>

  `;

}

/* =========================

   CATEGORY ITEMS

========================= */

function showCategory(category){

  currentCategory=category;

  let items=[];

  if(category==="Burgers")

    items=burgers;

  if(category==="Sides")

    items=sides;

  if(category==="Salads")

    items=salads;

  if(category==="Soft Drinks")

    items=drinks;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="categories()"

      >

        ← Categories

      </button>

      <div class="logo">

        MR K BURGERS

        <span>

          ${category.toUpperCase()}

        </span>

      </div>

      <div class="panel">

        <h2>

          ${category}

        </h2>

        <div class="grid">

          ${items.map(

            (item,index)=>`

              <div class="card">

                <div class="badge">

                  ${category.toUpperCase()}

                  ${index+1}

                </div>

                <h3>

                  ${item}

                </h3>

                <p class="muted">

                  ${

                    category==="Burgers"

                    ? "Configure this burger before adding it to the order."

                    : "Select to add to order."

                  }

                </p>

                <button

                  class="primary"

                  onclick="selectItem('${item}')"

                >

                  SELECT

                </button>

              </div>

            `

          ).join("")}

        </div>

      </div>

      ${cartSummary()}

    </div>

  `;

}

/* =========================

   SELECT ITEM

========================= */

function selectItem(name){

  if(currentCategory==="Burgers"){

    burgerCustomizer(name);

    return;

  }

  addSimpleItem(name);

}

/* =========================

   BURGER CUSTOMIZATION

========================= */

function burgerCustomizer(name){

  const detail=

    burgerDetails[name] || {

      ingredients:[

        "Freshly prepared ingredients"

      ]

    };

  currentQty=1;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="showCategory('Burgers')"

      >

        ← Burgers

      </button>

      <div class="logo">

        MR K BURGERS

        <span>

          BURGER CUSTOMIZATION

        </span>

      </div>

      <div class="panel">

        <h1>

          ${name}

        </h1>

        <p class="muted">

          Customize the burger before

          adding it to the order.

        </p>

        <!-- INCLUDED INGREDIENTS -->

        <div class="panel">

          <div class="badge">

            INCLUDED INGREDIENTS

          </div>

          ${

            detail.ingredients.map(

              ingredient=>`

                <label class="option">

                  <span>

                    ${ingredient}

                  </span>

                  <input

                    type="checkbox"

                    checked

                    value="${ingredient}"

                    class="ingredient"

                  >

                </label>

              `

            ).join("")

          }

        </div>

        <!-- EXTRA SAUCES -->

        <div class="panel">

          <div class="badge">

            EXTRA SAUCES

          </div>

          ${

            extraSauces.map(

              sauce=>`

                <label class="option">

                  <span>

                    ${sauce}

                  </span>

                  <input

                    type="checkbox"

                    value="${sauce}"

                    class="sauce"

                  >

                </label>

              `

            ).join("")

          }

        </div>

        <!-- QUANTITY -->

        <div class="panel">

          <div class="badge">

            QUANTITY

          </div>

          <div class="qty">

            <button

              onclick="changeQty(-1)"

            >

              −

            </button>

            <strong id="qty">

              1

            </strong>

            <button

              onclick="changeQty(1)"

            >

              ＋

            </button>

          </div>

        </div>

        <div class="notice">

          Burger price will be added

          when we enter the official

          Mr K menu prices.

        </div>

        <button

          class="primary"

          style="width:100%;margin-top:18px"

          onclick="addBurgerToCart('${name}')"

        >

          ADD TO ORDER →

        </button>

      </div>

    </div>

  `;

}

/* =========================

   QUANTITY

========================= */

function changeQty(delta){

  currentQty=

    Math.max(

      1,

      currentQty+delta

    );

  document.getElementById("qty")

    .textContent=currentQty;

}

/* =========================

   ADD BURGER

========================= */

function addBurgerToCart(name){

  const ingredients=[

    ...document.querySelectorAll(

      ".ingredient:checked"

    )

  ].map(

    item=>item.value

  );

  const sauces=[

    ...document.querySelectorAll(

      ".sauce:checked"

    )

  ].map(

    item=>item.value

  );

  cart.push({

    name:name,

    qty:currentQty,

    ingredients:ingredients,

    sauces:sauces

  });

  categories();

}

/* =========================

   ADD SIDE / SALAD / DRINK

========================= */

function addSimpleItem(name){

  cart.push({

    name:name,

    qty:1,

    ingredients:[],

    sauces:[]

  });

  categories();

}

/* =========================

   CART SUMMARY

========================= */

function cartSummary(){

  if(!cart.length)

    return "";

  return `

    <div class="summary">

      <div class="badge">

        CURRENT ORDER

      </div>

      <h3>

        ${cart.length}

        item${cart.length>1?"s":""}

      </h3>

      <button

        class="primary"

        onclick="viewCart()"

      >

        VIEW ORDER →

      </button>

    </div>

  `;

}

/* =========================

   CART

========================= */

function viewCart(){

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="categories()"

      >

        ← Categories

      </button>

      <div class="logo">

        MR K BURGERS

        <span>

          CURRENT ORDER

        </span>

      </div>

      <div class="panel">

        <h2>

          Order Summary

        </h2>

        ${

          cart.map(

            (item,index)=>`

              <div class="card">

                <div class="badge">

                  ITEM ${index+1}

                </div>

                <h3>

                  ${item.qty}

                  ×

                  ${item.name}

                </h3>

                ${

                  item.ingredients.length

                  ?

                  `

                    <p class="muted">

                      Ingredients:

                      ${item.ingredients.join(", ")}

                    </p>

                  `

                  :

                  ""

                }

                ${

                  item.sauces.length

                  ?

                  `

                    <p class="muted">

                      Extra sauces:

                      ${item.sauces.join(", ")}

                    </p>

                  `

                  :

                  ""

                }

              </div>

            `

          ).join("")

        }

        <button

          class="primary"

          style="width:100%;margin-top:18px"

          onclick="alert('Checkout will be built next.')"

        >

          CHECKOUT →

        </button>

      </div>

    </div>

  `;

}

render();

</script>

</body>

</html>
