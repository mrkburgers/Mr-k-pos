<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#111111">

<title>Mr K Burgers POS</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#111;

  color:#f5f1e8;

  font-family:Arial,Helvetica,sans-serif;

}

button,input{font:inherit}

button{

  cursor:pointer;

  border:1px solid #444;

  background:#252525;

  color:white;

  border-radius:12px;

  padding:15px 20px;

}

.primary{

  background:#f3a51b;

  color:#111;

  border-color:#f3a51b;

  font-weight:bold;

}

.app{

  min-height:100vh;

  padding:24px;

  max-width:1100px;

  margin:auto;

}

.logo{

  font-size:28px;

  font-weight:800;

}

.logo span{

  display:block;

  color:#f3a51b;

  font-size:11px;

  letter-spacing:3px;

  margin-top:4px;

}

.panel{

  background:#1b1b1b;

  border:1px solid #373737;

  border-radius:16px;

  padding:20px;

  margin-top:18px;

}

.grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;

}

.card{

  background:#242424;

  border:1px solid #373737;

  border-radius:14px;

  padding:20px;

}

.card button{

  width:100%;

  margin-top:15px;

}

.clickable{

  cursor:pointer;

  transition:.15s;

}

.clickable:active{

  transform:scale(.98);

}

.category{

  min-height:150px;

  text-align:left;

}

.form{

  display:grid;

  gap:12px;

  max-width:550px;

}

input{

  width:100%;

  padding:14px;

  border-radius:10px;

  border:1px solid #444;

  background:#0d0d0d;

  color:white;

}

.muted{color:#aaa}

.badge{

  color:#f3a51b;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.login{

  min-height:100vh;

  display:grid;

  place-items:center;

  padding:20px;

}

.loginbox{

  width:min(430px,100%);

  background:#191919;

  border:1px solid #373737;

  border-radius:18px;

  padding:30px;

}

.back{margin-bottom:20px}

.option{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:12px;

  padding:14px;

  margin:10px 0;

}

.option input{

  width:22px;

  height:22px;

}

.qty{

  display:flex;

  align-items:center;

  gap:15px;

}

.qty button{

  width:48px;

  height:48px;

  padding:0;

  font-size:24px;

}

.qty strong{

  min-width:30px;

  text-align:center;

  font-size:24px;

}

.extra-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:12px;

  padding:14px;

  margin:10px 0;

}

.extra-name{

  flex:1;

  font-weight:bold;

}

.extra-qty{

  display:flex;

  align-items:center;

  gap:10px;

}

.extra-qty button{

  width:42px;

  height:42px;

  padding:0;

  font-size:22px;

}

.extra-qty strong{

  min-width:28px;

  text-align:center;

  font-size:20px;

}

.summary{

  background:#101010;

  border:1px solid #3b3b3b;

  border-radius:14px;

  padding:18px;

  margin-top:18px;

}

.order-card{

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:16px;

  padding:18px;

  margin:14px 0;

}

.order-top{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:15px;

}

.order-number{

  font-size:22px;

  font-weight:bold;

}

.timer{

  font-size:24px;

  font-weight:800;

  color:#f3a51b;

  font-variant-numeric:tabular-nums;

}

.status{

  display:inline-block;

  background:#302715;

  border:1px solid #6c5220;

  color:#f3a51b;

  padding:7px 10px;

  border-radius:999px;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.locked{

  display:inline-block;

  padding:7px 10px;

  border-radius:999px;

  background:#202020;

  border:1px solid #555;

  color:#bbb;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.info-row{

  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:9px 0;

  border-bottom:1px solid #333;

}

.info-row:last-child{

  border-bottom:none;

}

.system-note{

  border-left:4px solid #f3a51b;

  padding:12px 14px;

  background:#181818;

  margin-top:12px;

  color:#bbb;

}

.danger-text{

  color:#ff8c8c;

}

@media(max-width:700px){

  .app{padding:16px}

  .grid{grid-template-columns:1fr}

  .order-top{flex-direction:column}

}

</style>

</head>

<body>

<div id="root"></div>

<script>

let loggedIn=false;

let orderType="";

let currentCategory="";

let currentQty=1;

let currentExtraQty={};

let cart=[];

let customer={

  name:"",

  phone:"",

  address:""

};

/*

ACTIVE ORDERS

Stored locally for this prototype.

*/

let activeOrders=

  JSON.parse(localStorage.getItem("mrkActiveOrders") || "[]");

let nextOrderNumber=

  Number(localStorage.getItem("mrkNextOrderNumber") || "1");

let timerInterval=null;

/* =========================

   MENU

========================= */

const burgers=[

  "Mr K Classic",

  "Mushroom & Swiss",

  "Honky Tonk",

  "Philly Cheesesteak",

  "Only The Brave",

  "Bohemian",

  "Chicken Chimichurri"

];

const sides=[

  "French Fries",

  "Plantain Tostones",

  "Onion Rings",

  "Cheese Fries",

  "Fajita Cheese Fries",

  "Dirty Fries"

];

const salads=[

  "Mr K Coleslaw",

  "Cheeseburger Salad"

];

const drinks=[

  "Small Water",

  "Big Water",

  "Coca Cola",

  "Sprite",

  "Fanta"

];

const sauces=[

  "Mr K Sauce",

  "Chimichurri",

  "Ketchup",

  "Mayonnaise",

  "Honey Mustard",

  "Honey BBQ"

];

/* =========================

   BURGER RECIPES

========================= */

const burgerDetails={

  "Mr K Classic":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Rocket lettuce",

      "Tomato",

      "Onions",

      "Pickled cucumbers",

      "Mr K sauce"

    ]

  },

  "Mushroom & Swiss":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Mushrooms",

      "Swiss cheese",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Honky Tonk":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Bacon",

      "Swiss cheese",

      "Cheddar cheese",

      "Rocket lettuce",

      "Sauce",

      "Onion rings"

    ]

  },

  "Philly Cheesesteak":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Mozzarella cheese",

      "Cheddar cheese",

      "Sautéed beef tenderloin 100g",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Only The Brave":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g ×3",

      "Burger bun",

      "Cheddar cheese ×3",

      "Bacon",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Bohemian":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Mozzarella cheese",

      "Smoked turkey",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Chicken Chimichurri":{

    meat:"chicken",

    ingredients:[

      "Chicken steak 120g",

      "Burger bun",

      "Mozzarella cheese",

      "Cheddar cheese",

      "Chimichurri",

      "Rocket lettuce",

      "Sauce"

    ]

  }

};

const beefExtras=[

  "Extra beef patty",

  "Extra cheddar cheese",

  "Extra mozzarella cheese",

  "Extra Swiss cheese",

  "Extra mushroom",

  "Extra onion rings",

  "Extra bacon"

];

const chickenExtras=[

  "Extra chicken steak",

  "Extra cheddar cheese",

  "Extra mozzarella cheese",

  "Extra Swiss cheese",

  "Extra mushroom",

  "Extra onion rings",

  "Extra bacon"

];

const loadedFries=[

  "Cheese Fries",

  "Fajita Cheese Fries",

  "Dirty Fries"

];

/* =========================

   LOGIN

========================= */

function render(){

  if(!loggedIn){

    document.getElementById("root").innerHTML=`

      <div class="login">

        <div class="loginbox">

          <div class="logo">

            MR K BURGERS

            <span>POS PROTOTYPE</span>

          </div>

          <div class="form" style="margin-top:30px">

            <label>Cashier ID</label>

            <input id="user" value="cashier01">

            <label>PIN</label>

            <input id="pin" type="password" value="1234">

            <button

              class="primary"

              onclick="login()"

            >

              LOGIN

            </button>

            <p class="muted">

              Prototype: cashier01 / 1234

            </p>

          </div>

        </div>

      </div>

    `;

    return;

  }

  home();

}

function login(){

  if(

    document.getElementById("user").value==="cashier01" &&

    document.getElementById("pin").value==="1234"

  ){

    loggedIn=true;

    render();

  }else{

    alert("Incorrect Cashier ID or PIN.");

  }

}

/* =========================

   HOME

========================= */

function home(){

  stopTimerRefresh();

  document.getElementById("root").innerHTML=`

    <div class="app">

      <div class="logo">

        MR K BURGERS

        <span>CASHIER POS</span>

      </div>

      <div class="panel">

        <h1>Cashier Home</h1>

        <p class="muted">

          Ready to take the next order.

        </p>

        <button

          class="primary"

          onclick="newOrder()"

        >

          ＋ NEW ORDER

        </button>

      </div>

      <div class="grid">

        <div

          class="card clickable"

          onclick="showActiveOrders()"

        >

          <div class="badge">

            ACTIVE ORDERS

          </div>

          <h2>

            ${activeOrders.length}

          </h2>

          <div class="muted">

            Tap to view kitchen orders

          </div>

        </div>

        <div class="card">

          <div class="badge">

            TODAY'S ORDERS

          </div>

          <h2>

            ${activeOrders.length}

          </h2>

        </div>

        <div class="card">

          <div class="badge">

            TODAY'S SALES

          </div>

          <h2>

            0 CFA

          </h2>

        </div>

      </div>

      ${

        activeOrders.length

        ?

        `

        <div class="panel">

          <div class="badge">

            LIVE KITCHEN ORDERS

          </div>

          <h2>Current Timers</h2>

          <div id="homeTimers">

            ${homeTimerCards()}

          </div>

        </div>

        `

        :

        ""

      }

    </div>

  `;

  if(activeOrders.length){

    startHomeTimers();

  }

}

function homeTimerCards(){

  return activeOrders.map(order=>`

    <div

      class="order-card clickable"

      onclick="viewActiveOrder(${order.id})"

    >

      <div class="order-top">

        <div>

          <div class="order-number">

            Order #${formatOrderNumber(order.number)}

          </div>

          <div class="muted">

            ${order.customer.name} • ${order.type}

          </div>

        </div>

        <div

          class="timer"

          data-start="${order.startedAt}"

        >

          ${formatTimer(order.startedAt)}

        </div>

      </div>

      <div style="margin-top:12px">

        <span class="status">

          ${order.status}

        </span>

      </div>

    </div>

  `).join("");

}

/* =========================

   NEW ORDER

========================= */

function newOrder(){

  stopTimerRefresh();

  cart=[];

  orderType="";

  customer={

    name:"",

    phone:"",

    address:""

  };

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="home()"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>NEW ORDER</span>

      </div>

      <div class="panel">

        <h2>Choose Order Type</h2>

        <div class="grid">

          <button onclick="customerForm('Dine In')">

            <h3>🍽️ DINE IN</h3>

          </button>

          <button onclick="customerForm('Takeaway')">

            <h3>🥡 TAKEAWAY</h3>

          </button>

          <button onclick="customerForm('Delivery')">

            <h3>🛵 DELIVERY</h3>

          </button>

        </div>

      </div>

    </div>

  `;

}

/* =========================

   CUSTOMER

========================= */

function customerForm(type){

  orderType=type;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="newOrder()"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>${type.toUpperCase()}</span>

      </div>

      <div class="panel">

        <h2>Customer</h2>

        <div class="form">

          <label>Customer Name</label>

          <input

            id="name"

            placeholder="Customer name"

            value="${customer.name}"

          >

          <label>

            Phone ${

              type==="Delivery"

              ? "(required)"

              : "(optional)"

            }

          </label>

          <input

            id="phone"

            placeholder="+223 ..."

            value="${customer.phone}"

          >

          ${

            type==="Delivery"

            ?

            `

            <label>

              Delivery Address

            </label>

            <input

              id="address"

              placeholder="Delivery address"

              value="${customer.address}"

            >

            `

            :

            ""

          }

          <button

            class="primary"

            onclick="continueToMenu()"

          >

            CONTINUE TO MENU →

          </button>

        </div>

      </div>

    </div>

  `;

}

function continueToMenu(){

  customer.name=

    document.getElementById("name").value.trim();

  customer.phone=

    document.getElementById("phone").value.trim();

  if(orderType==="Delivery"){

    customer.address=

      document.getElementById("address").value.trim();

  }

  if(!customer.name){

    alert("Please enter the customer's name.");

    return;

  }

  if(

    orderType==="Delivery" &&

    (!customer.phone || !customer.address)

  ){

    alert("Delivery requires phone number and address.");

    return;

  }

  categories();

}

/* =========================

   CATEGORIES

========================= */

function categories(){

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="customerForm(orderType)"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>MENU CATEGORIES</span>

      </div>

      <div class="panel">

        <h2>Choose a Category</h2>

        <div class="grid">

          ${categoryButton(

            "🍔",

            "Burgers",

            burgers.length+" burgers"

          )}

          ${categoryButton(

            "🍟",

            "Sides",

            sides.length+" sides"

          )}

          ${categoryButton(

            "🥗",

            "Salads",

            salads.length+" salads"

          )}

          ${categoryButton(

            "🥤",

            "Soft Drinks",

            drinks.length+" drinks"

          )}

          ${categoryButton(

            "🥫",

            "Extra Sauces",

            sauces.length+" sauces"

          )}

        </div>

      </div>

      ${cartSummary()}

    </div>

  `;

}

function categoryButton(icon,name,count){

  return `

    <button

      class="category"

      onclick="showCategory('${name}')"

    >

      <div class="badge">

        MENU CATEGORY

      </div>

      <h2>

        ${icon} ${name}

      </h2>

      <span class="muted">

        ${count}

      </span>

    </button>

  `;

}

/* =========================

   CATEGORY

========================= */

function showCategory(category){

  currentCategory=category;

  let items=[];

  if(category==="Burgers") items=burgers;

  if(category==="Sides") items=sides;

  if(category==="Salads") items=salads;

  if(category==="Soft Drinks") items=drinks;

  if(category==="Extra Sauces") items=sauces;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="categories()"

      >

        ← Categories

      </button>

      <div class="logo">

        MR K BURGERS

        <span>${category.toUpperCase()}</span>

      </div>

      <div class="panel">

        <h2>${category}</h2>

        <div class="grid">

          ${

            items.map((item,index)=>`

              <div class="card">

                <div class="badge">

                  ITEM ${index+1}

                </div>

                <h3>

                  ${item}

                </h3>

                <button

                  class="primary"

                  onclick="selectItem('${item}')"

                >

                  SELECT

                </button>

              </div>

            `).join("")

          }

        </div>

      </div>

      ${cartSummary()}

    </div>

  `;

}

function selectItem(name){

  if(currentCategory==="Burgers"){

    burgerCustomizer(name);

    return;

  }

  if(

    currentCategory==="Sides" &&

    loadedFries.includes(name)

  ){

    loadedFriesCustomizer(name);

    return;

  }

  quantityOnly(name);

}

/* =========================

   EXTRA QUANTITY SYSTEM

========================= */

function resetExtras(extras){

  currentExtraQty={};

  extras.forEach(extra=>{

    currentExtraQty[extra]=0;

  });

}

function extraRows(extras){

  return extras.map(extra=>`

    <div class="extra-row">

      <div class="extra-name">

        ${extra}

      </div>

      <div class="extra-qty">

        <button

          onclick="changeExtraQty('${extra}',-1)"

        >

          −

        </button>

        <strong

          id="extra-${safeId(extra)}"

        >

          0

        </strong>

        <button

          onclick="changeExtraQty('${extra}',1)"

        >

          ＋

        </button>

      </div>

    </div>

  `).join("");

}

function safeId(text){

  return text

    .replace(/[^a-zA-Z0-9]/g,"-")

    .toLowerCase();

}

function changeExtraQty(extra,change){

  currentExtraQty[extra]=

    Math.max(

      0,

      (currentExtraQty[extra] || 0)+change

    );

  const element=

    document.getElementById(

      "extra-"+safeId(extra)

    );

  if(element){

    element.textContent=

      currentExtraQty[extra];

  }

}

/* =========================

   BURGER CUSTOMIZATION

========================= */

function burgerCustomizer(name){

  const burger=burgerDetails[name];

  const extras=

    burger.meat==="chicken"

    ? chickenExtras

    : beefExtras;

  currentQty=1;

  resetExtras(extras);

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="showCategory('Burgers')"

      >

        ← Burgers

      </button>

      <div class="logo">

        MR K BURGERS

        <span>BURGER CUSTOMIZATION</span>

      </div>

      <div class="panel">

        <h1>${name}</h1>

        <div class="panel">

          <div class="badge">

            INCLUDED INGREDIENTS

          </div>

          ${

            burger.ingredients.map(ingredient=>`

              <label class="option">

                <span>

                  ${ingredient}

                </span>

                <input

                  type="checkbox"

                  class="included"

                  value="${ingredient}"

                  checked

                >

              </label>

            `).join("")

          }

        </div>

        <div class="panel">

          <div class="badge">

            ADD EXTRAS

          </div>

          ${extraRows(extras)}

        </div>

        ${quantityControls()}

        <button

          class="primary"

          style="width:100%;margin-top:18px"

          onclick="addCustomizedItem('${name}')"

        >

          ADD TO ORDER →

        </button>

      </div>

    </div>

  `;

}

/* =========================

   LOADED FRIES

========================= */

function loadedFriesCustomizer(name){

  currentQty=1;

  const extras=[

    "Extra grated cheese"

  ];

  resetExtras(extras);

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="showCategory('Sides')"

      >

        ← Sides

      </button>

      <div class="logo">

        MR K BURGERS

        <span>SIDE CUSTOMIZATION</span>

      </div>

      <div class="panel">

        <h1>${name}</h1>

        <div class="panel">

          <div class="badge">

            ADD EXTRA

          </div>

          ${extraRows(extras)}

        </div>

        ${quantityControls()}

        <button

          class="primary"

          style="width:100%;margin-top:18px"

          onclick="addCustomizedItem('${name}')"

        >

          ADD TO ORDER →

        </button>

      </div>

    </div>

  `;

}

/* =========================

   SIMPLE ITEMS

========================= */

function quantityOnly(name){

  currentQty=1;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="showCategory(currentCategory)"

      >

        ← Back

      </button>

      <div class="logo">

        MR K BURGERS

        <span>${currentCategory.toUpperCase()}</span>

      </div>

      <div class="panel">

        <h1>${name}</h1>

        ${quantityControls()}

        <button

          class="primary"

          style="width:100%;margin-top:18px"

          onclick="addSimpleItem('${name}')"

        >

          ADD TO ORDER →

        </button>

      </div>

    </div>

  `;

}

/* =========================

   PRODUCT QUANTITY

========================= */

function quantityControls(){

  return `

    <div class="panel">

      <div class="badge">

        PRODUCT QUANTITY

      </div>

      <div class="qty">

        <button onclick="changeQty(-1)">

          −

        </button>

        <strong id="qty">

          1

        </strong>

        <button onclick="changeQty(1)">

          ＋

        </button>

      </div>

    </div>

  `;

}

function getRemovedIngredients(item){

  if(!burgerDetails[item.name]){

    return [];

  }

  const original=

    burgerDetails[item.name].ingredients;

  return original.filter(

    ingredient=>

      !item.included.includes(ingredient)

  );

}

/* =========================

========================= */

function formatTimer(startedAt){

  const elapsed=

    Math.max(

      0,

      Date.now()-startedAt

    );

  const totalSeconds=

    Math.floor(elapsed/1000);

  const hours=

    Math.floor(totalSeconds/3600);

  const minutes=

    Math.floor(

      (totalSeconds%3600)/60

    );

  const seconds=

    totalSeconds%60;

  if(hours>0){

    return (

      String(hours).padStart(2,"0")

      +":"

      +String(minutes).padStart(2,"0")

      +":"

      +String(seconds).padStart(2,"0")

    );

  }

  return (

    String(minutes).padStart(2,"0")

    +":"

    +String(seconds).padStart(2,"0")

  );

}

function updateVisibleTimers(){

  document

    .querySelectorAll("[data-start]")

    .forEach(element=>{

      const start=

        Number(

          element.getAttribute("data-start")

        );

      element.textContent=

        formatTimer(start);

    });

}

function stopTimerRefresh(){

    clearInterval(timerInterval);

}
