<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#111111">
<!-- Pages deployment refresh 2 -->
<title>Mr K Burgers POS</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#111;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}

button,input{font:inherit}

button{cursor:pointer;border:1px solid #444;background:#252525;color:white;border-radius:12px;padding:15px 20px}

.primary{background:#f3a51b;color:#111;border-color:#f3a51b;font-weight:bold}

.secondary{background:#252525;color:white;border-color:#555;font-weight:bold}

.danger{background:#351b1b;border-color:#703434;color:#ffb0b0}

.green{background:#17351e;border-color:#397548;color:#b8ffc8;font-weight:bold}

.app{min-height:100vh;padding:24px;max-width:1100px;margin:auto}

.logo{font-size:28px;font-weight:800}

.logo span{display:block;color:#f3a51b;font-size:11px;letter-spacing:3px;margin-top:4px}

.panel{background:#1b1b1b;border:1px solid #373737;border-radius:16px;padding:20px;margin-top:18px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}

.card{background:#242424;border:1px solid #373737;border-radius:14px;padding:20px}

.clickable{cursor:pointer;transition:.15s}

.clickable:active{transform:scale(.98)}

.category{min-height:150px;text-align:left}

.category-icon{font-size:38px;margin-bottom:12px}

.form{display:grid;gap:12px;max-width:550px}

input{width:100%;max-width:100%;min-width:0;padding:14px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:white}
#shiftHistoryDate{

  display:block;

  width:100%;

  max-width:100%;

  min-width:0;

  box-sizing:border-box;

  -webkit-appearance:none;

  appearance:none;

}
.muted{color:#aaa}

.badge{color:#f3a51b;font-size:11px;font-weight:bold;letter-spacing:1px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}

.loginbox{width:min(430px,100%);background:#191919;border:1px solid #373737;border-radius:18px;padding:30px}

.back{margin-bottom:20px}

.qty{display:flex;align-items:center;gap:15px}

.qty button{width:48px;height:48px;padding:0;font-size:24px}

.qty strong{min-width:30px;text-align:center;font-size:24px}

.extra-row{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#202020;border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:10px 0}

.extra-name{flex:1;font-weight:bold}

.extra-qty{display:flex;align-items:center;gap:10px}

.extra-qty button{width:42px;height:42px;padding:0;font-size:22px}

.extra-qty strong{min-width:28px;text-align:center;font-size:20px}

.ingredient-row{display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:8px 0}

.ingredient-row input{width:22px;height:22px;accent-color:#f3a51b;flex:0 0 auto}

.ingredient-row label{font-weight:bold;flex:1}

.no-item{color:#ff9b9b;font-weight:bold;margin-top:5px}

.summary{background:#101010;border:1px solid #3b3b3b;border-radius:14px;padding:18px;margin-top:18px}

.order-card{background:#202020;border:1px solid #3b3b3b;border-radius:16px;padding:18px;margin:14px 0}

.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}

.order-number{font-size:22px;font-weight:bold}

.timer{font-size:24px;font-weight:800;color:#f3a51b;font-variant-numeric:tabular-nums}

.status{display:inline-block;background:#302715;border:1px solid #6c5220;color:#f3a51b;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}

.status.ready{background:#17351e;border-color:#397548;color:#b8ffc8}

.status.completed{background:#252525;border-color:#555;color:#bbb}

.draft-status{display:inline-block;background:#1c2730;border:1px solid #3e6176;color:#8ccdf3;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}

.info-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #333}

.info-row:last-child{border-bottom:none}

.system-note{border-left:4px solid #f3a51b;padding:12px 14px;background:#181818;margin-top:12px;color:#bbb}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}

.actions button{flex:1;min-width:150px}

.cart-count{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#f3a51b;color:#111;font-size:11px;font-weight:bold}

.kitchen-title{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}

.kitchen-item{font-size:18px;font-weight:bold;padding:10px 0;border-bottom:1px solid #333}

.kitchen-item:last-child{border-bottom:none}

@media(max-width:700px){

  .app{padding:16px}

  .grid{grid-template-columns:1fr}

  .order-top{flex-direction:column}

}
@media print{

  button{

    display:none !important;

  }

  body{

    background:#fff !important;

    color:#000 !important;

  }

  .panel{

    box-shadow:none !important;

    border:none !important;

  }

}
</style>

</head>

<body>

<div id="root"></div>

<script>

let loggedIn=false;

let role="";
let currentStaffName="";

let currentStaffId="";
let orderType="";

let currentCategory="";

let currentQty=1;

let currentExtraQty={};

let currentRemovedIngredients=[];
let currentCustomizeItem="";
let currentDraftId=null;

let cart=[];

let customer={name:"",phone:"",address:"",table:""};

let activeOrders=safeLoad("mrkActiveOrders",[]);

let draftOrders=safeLoad("mrkDraftOrders",[]);

let completedOrders=safeLoad("mrkCompletedOrders",[]);

let nextOrderNumber=Number(localStorage.getItem("mrkNextOrderNumber")||"1");
let ownerCashAccount=safeLoad("mrkOwnerCashAccount",{

 balance:0,

 transactions:[]

});
let expenses=safeLoad("mrkExpenses",[]);

let expenseCategories=safeLoad("mrkExpenseCategories",[

 {

  id:"purchases",

  name:"Purchases",

  active:true

 },

 {

  id:"gas",

  name:"Gas",

  active:true

 },

 {

  id:"electricity",

  name:"Electricity",

  active:true

 },

 {

  id:"packaging",

  name:"Packaging",

  active:true

 },

 {

  id:"maintenance",

  name:"Maintenance",

  active:true

 },

 {

  id:"rent",

  name:"Rent",

  active:true

 },

 {

  id:"cleaning",

  name:"Cleaning",

  active:true

 },

 {

  id:"transport",

  name:"Transport",

  active:true

 },

 {

  id:"internetPhone",

  name:"Internet / Phone",

  active:true

 },

 {

  id:"marketing",

  name:"Marketing",

  active:true

 },

 {

  id:"miscellaneous",

  name:"Miscellaneous",

  active:true

 }

]);
let timerInterval=null;


function safeLoad(key,fallback){

 try{

   const raw=localStorage.getItem(key);

   if(raw===null)return fallback;

   return JSON.parse(raw);

 }catch(e){

   return fallback;

 }

}
  function addOwnerCashTransaction(type,amount,description,source="MANUAL"){

 amount=Number(amount);

 if(!Number.isFinite(amount) || amount<=0){

  return false;

 }

 if(type!=="IN" && type!=="OUT"){

  return false;

 }

 if(type==="IN"){

  ownerCashAccount.balance=

   Number(ownerCashAccount.balance || 0)+amount;

 }else{

  ownerCashAccount.balance=

   Number(ownerCashAccount.balance || 0)-amount;

 }

 if(!Array.isArray(ownerCashAccount.transactions)){

  ownerCashAccount.transactions=[];

 }

 ownerCashAccount.transactions.unshift({

  id:

   "cashTransaction_"+

   Date.now()+"_"+

   Math.random().toString(36).slice(2,8),

  type:type,

  amount:amount,

  description:description || "",

  source:source,

  createdAt:Date.now(),

  createdBy:currentStaffName,

  createdByStaffId:currentStaffId,

  balanceAfter:ownerCashAccount.balance

 });

 saveOwnerCashAccount();

 return true;

}
  function saveOwnerCashAccount(){

 localStorage.setItem(

  "mrkOwnerCashAccount",

  JSON.stringify(ownerCashAccount)

 );

}
function saveExpenses(){

 localStorage.setItem(

  "mrkExpenses",

  JSON.stringify(expenses)

 );

}

function saveExpenseCategories(){

 localStorage.setItem(

  "mrkExpenseCategories",

  JSON.stringify(expenseCategories)

 );

}
function esc(v){

 return String(v||"")

 .replace(/&/g,"&amp;")

 .replace(/"/g,"&quot;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;");

}

function padOrder(n){

 return String(n).padStart(3,"0");

}

function orderCart(o){

 if(Array.isArray(o.cart))return o.cart;

 if(Array.isArray(o.items))return o.items;

 return [];

}
function orderTotal(o){

 if(Number.isFinite(Number(o.total))){

  return Number(o.total);

 }

 return orderCart(o).reduce(

  (sum,item)=>sum+itemLineTotal(item),

  0

 );

}
function orderLabel(o){

 if(o.type==="DINE IN"){

   if(o.customer&&o.customer.table)return `Table ${o.customer.table}`;

   return o.customer?.name||"Dine In";

 }

 return o.customer?.name||o.type||"Order";

}

function currentCustomerLabel(){

 return orderType==="DINE IN"?`Table ${customer.table}`:customer.name;

}

function formatDateTime(timestamp){

 if(!timestamp)return "—";

 try{

   return new Date(Number(timestamp)).toLocaleString();

 }catch(e){

   return "—";

 }

}

function prepDuration(o){

 if(!o.startedAt||!o.readyAt)return "—";

 return formatTimer(o.startedAt,o.readyAt);

}

function saveOrders(){

 localStorage.setItem("mrkActiveOrders",JSON.stringify(activeOrders));

 localStorage.setItem("mrkDraftOrders",JSON.stringify(draftOrders));

 localStorage.setItem("mrkCompletedOrders",JSON.stringify(completedOrders));

 localStorage.setItem("mrkNextOrderNumber",String(nextOrderNumber));

}

function render(){

 if(!loggedIn)return loginScreen();

 if(role==="kitchen")return kitchenHome();
 if(role==="manager")return managerHome();
if(role==="owner")return ownerHome();
 home();

}

function loginScreen(){

 document.getElementById("root").innerHTML=`

 <div class="login">

  <div class="loginbox">

   <div class="logo">MR K BURGERS<span>POS SYSTEM</span></div>

   <div class="form" style="margin-top:30px">

    <label>Staff ID</label>

    <input id="user" placeholder="Staff ID">

    <label>PIN</label>

    <input id="pin" type="password" placeholder="PIN">

    <button class="primary" onclick="login()">LOGIN</button>

   </div>

   <p class="muted" style="margin-top:20px">

    ${staffAccounts

 .filter(s=>s.active)

 .map(s=>`${esc(s.name)}: ${esc(s.staffId)}`)

 .join("<br>")}

<br>

${esc(ownerAccount.name)}: ${esc(ownerAccount.staffId)}

   </p>

  </div>

 </div>`;

}
let staffAccounts=safeLoad("mrkStaffAccounts",[

 {

  name:"Manager",

  staffId:"manager01",

  pin:"9012",

  role:"manager",

  active:true

 },

 {

  name:"Cashier",

  staffId:"cashier01",

  pin:"1234",

  role:"cashier",

  active:true

 },

 {

  name:"Kitchen",

  staffId:"kitchen01",

  pin:"5678",

  role:"kitchen",

  active:true

 }

]);
let ownerAccount=safeLoad("mrkOwnerAccount",{

 name:"Owner",

 staffId:"owner01",

 pin:"1991"

});

function saveOwnerAccount(){

 localStorage.setItem(

  "mrkOwnerAccount",

  JSON.stringify(ownerAccount)

 );

}
function saveStaffAccounts(){

 localStorage.setItem(

  "mrkStaffAccounts",

  JSON.stringify(staffAccounts)

 );

}
function login(){

 const u=document

  .getElementById("user")

  .value.trim();

 const p=document

  .getElementById("pin")

  .value.trim();

 if(

 u.toLowerCase()===ownerAccount.staffId.toLowerCase() &&

 p===ownerAccount.pin

){

 loggedIn=true;

 role="owner";
currentStaffName=ownerAccount.name;

currentStaffId=ownerAccount.staffId;
 ownerHome();

 return;

}

 const staff=staffAccounts.find(

  s=>

   s.staffId.toLowerCase()===u.toLowerCase() &&

   s.pin===p

 );

 if(!staff){

  alert("Invalid Staff ID or PIN.");

  return;

 }

 if(!staff.active){

  alert("This staff account is inactive.");

  return;

 }

 loggedIn=true;

 role=staff.role;
currentStaffName=staff.name;

currentStaffId=staff.staffId;
 if(role==="manager"){

  managerHome();

  return;

 }

 if(role==="kitchen"){

  kitchenHome();

  return;

 }

 if(role==="cashier"){

  home();

  return;

 }

 alert("Invalid staff role.");

}

function logout(){

 loggedIn=false;

 role="";
currentStaffName="";

currentStaffId="";
 clearInterval(timerInterval);

 render();

}

function header(label){

 return `

 <div class="logo">MR K BURGERS<span>${label}</span></div>

 <button class="secondary" onclick="logout()">LOG OUT</button>`;

}
  function ownerHome(){

 clearInterval(timerInterval);

 document.getElementById("root").innerHTML=`

 <div class="app">

  <div class="kitchen-title">

   ${header("OWNER")}

  </div>

  <div class="panel">

   <span class="badge">

    👑 OWNER DASHBOARD

   </span>

   <h1>Business Management</h1>

   <div class="grid">

    

    <div class="card" onclick="ownerSales()" style="cursor:pointer">

     <div class="category-icon">💰</div>

     <h3>SALES</h3>

    </div>

    <div class="card" onclick="ownerSalesHistory()" style="cursor:pointer">

     <div class="category-icon">📅</div>

     <h3>SALES HISTORY</h3>

    </div>

    <div class="card" onclick="ownerInventory()" style="cursor:pointer">

     <div class="category-icon">📦</div>

     <h3>INVENTORY</h3>

    </div>

    <div class="card" onclick="ownerOrders()" style="cursor:pointer">

     <div class="category-icon">📋</div>

     <h3>ORDERS</h3>

    </div>
     <div class="card" onclick="ownerExpenses()" style="cursor:pointer">

      <div class="category-icon">🧾</div>

      <h3>EXPENSES</h3>

     </div>
     <div class="card" onclick="ownerCashAccountPage()" style="cursor:pointer">

 <div class="category-icon">💵</div>

 <h3>OWNER CASH ACCOUNT</h3>

</div>
    <div class="card" onclick="ownerReports()" style="cursor:pointer">

 <div class="category-icon">📈</div>

 <h3>REPORTS</h3>

</div>

    <div class="card" onclick="ownerStaffManagement()" style="cursor:pointer">

     <div class="category-icon">👥</div>

     <h3>STAFF MANAGEMENT</h3>

    </div>
 <div class="card" onclick="shiftManagementPageRender()">

  <div class="category-icon">🕒</div>

  <h3>SHIFT MANAGEMENT</h3>

</div>
    <div class="card" onclick="ownerPosSettings()" style="cursor:pointer">

     <div class="category-icon">⚙️</div>

     <h3>POS SETTINGS</h3>

    </div>

   </div>

  </div>

 </div>`;

}
  function ownerCashAccountPage(){

 if(role!=="owner"){

  alert("Only the owner can access the cash account.");

  ownerHome();

  return;

 }

 clearInterval(timerInterval);

 const balance=

  Number(ownerCashAccount.balance || 0);

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="ownerHome()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>OWNER — CASH ACCOUNT</span>

  </div>

  <div class="panel">

   <span class="badge">

    💵 OWNER CASH ACCOUNT

   </span>

   <h1>Cash Account</h1>

   <div class="summary">

    <div class="info-row">

     <span>Current Balance</span>

     <strong>

      ${balance.toLocaleString()} CFA

     </strong>

    </div>

   </div>

   <div class="grid" style="margin-top:20px">

    <div

     class="card"

     onclick="ownerCashInPage()"

     style="cursor:pointer">

     <div class="category-icon">➕</div>

     <h3>CASH IN</h3>

     <p class="muted">

      Add cash to the account

     </p>

    </div>

    <div

     class="card"

     onclick="ownerCashOutPage()"

     style="cursor:pointer">

     <div class="category-icon">➖</div>

     <h3>CASH OUT</h3>

     <p class="muted">

      Remove cash from the account

     </p>

    </div>

    <div

     class="card"

     onclick="ownerCashHistoryPage()"

     style="cursor:pointer">

     <div class="category-icon">📋</div>

     <h3>TRANSACTION HISTORY</h3>

     <p class="muted">

      View all cash movements

     </p>

    </div>

   </div>

  </div>

 </div>`;

}
  function ownerCashInPage(){

 if(role!=="owner"){

  alert("Only the owner can add cash.");

  ownerHome();

  return;

 }

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="ownerCashAccountPage()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>OWNER — CASH IN</span>

  </div>

  <div class="panel">

   <span class="badge">

    ➕ CASH IN

   </span>

   <h1>Add Cash</h1>

   <div class="form">

    <label>Amount</label>

    <input

     id="ownerCashInAmount"

     type="number"

     min="1"

     placeholder="Amount in CFA">

    <label>Reason</label>

    <input

     id="ownerCashInReason"

     type="text"

     placeholder="Example: Owner cash deposit">

    <button

     class="primary"

     onclick="saveOwnerCashIn()">

     ADD CASH

    </button>

   </div>

  </div>

 </div>`;

}
  function saveOwnerCashIn(){

 if(role!=="owner"){

  alert("Only the owner can add cash.");

  return;

 }

 const amount=

  Number(

   document.getElementById("ownerCashInAmount").value

  );

 const reason=

  document.getElementById("ownerCashInReason").value.trim();

 if(!Number.isFinite(amount) || amount<=0){

  alert("Enter a valid amount.");

  return;

 }

 if(!reason){

  alert("Enter a reason for this cash deposit.");

  return;

 }

 addOwnerCashTransaction(

  "IN",

  amount,

  reason,

  "MANUAL"

 );

 alert("Cash added successfully.");

 ownerCashAccountPage();

}
  function ownerCashOutPage(){

 if(role!=="owner"){

  alert("Only the owner can remove cash.");

  ownerHome();

  return;

 }

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="ownerCashAccountPage()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>OWNER — CASH OUT</span>

  </div>

  <div class="panel">

   <span class="badge">

    ➖ CASH OUT

   </span>

   <h1>Remove Cash</h1>

   <div class="form">

    <label>Amount</label>

    <input

     id="ownerCashOutAmount"

     type="number"

     min="1"

     placeholder="Amount in CFA">

    <label>Reason</label>

    <input

     id="ownerCashOutReason"

     type="text"

     placeholder="Example: Owner withdrawal">

    <button

     class="primary"

     onclick="saveOwnerCashOut()">

     REMOVE CASH

    </button>

   </div>

  </div>

 </div>`;

}
  function saveOwnerCashOut(){

 if(role!=="owner"){

  alert("Only the owner can remove cash.");

  return;

 }

 const amount=

  Number(

   document.getElementById("ownerCashOutAmount").value

  );

 const reason=

  document.getElementById("ownerCashOutReason").value.trim();

 if(!Number.isFinite(amount) || amount<=0){

  alert("Enter a valid amount.");

  return;

 }

 if(!reason){

  alert("Enter a reason for this cash withdrawal.");

  return;

 }
if(amount>Number(ownerCashAccount.balance || 0)){

 alert("Not enough cash in the Owner Cash Account.");

 return;

}
 addOwnerCashTransaction(

  "OUT",

  amount,

  reason,

  "MANUAL"

 );

 alert("Cash removed successfully.");

 ownerCashAccountPage();

}
  function ownerCashHistoryPage(){

 if(role!=="owner"){

  alert("Only the owner can view the cash account.");

  ownerHome();

  return;

 }

 const transactions=

  Array.isArray(ownerCashAccount.transactions)

   ? ownerCashAccount.transactions

   : [];

 const rows=transactions.map(t=>{

  const time=

   new Date(t.createdAt).toLocaleString();

  const sign=

   t.type==="IN" ? "+" : "-";

  return `

   <div class="summary" style="margin-bottom:12px">

    <div class="info-row">

     <span>${time}</span>

     <strong>${sign}${Number(t.amount || 0).toLocaleString()} CFA</strong>

    </div>

    <div class="info-row">

     <span>Type</span>

     <strong>${t.type==="IN" ? "CASH IN" : "CASH OUT"}</strong>

    </div>

    <div class="info-row">

     <span>Description</span>

     <strong>${t.description || "-"}</strong>

    </div>

    <div class="info-row">

     <span>Source</span>

     <strong>${t.source || "-"}</strong>

    </div>

    <div class="info-row">

     <span>Actor</span>

     <strong>${t.createdBy || "-"}</strong>

    </div>

    <div class="info-row">

     <span>Balance After</span>

     <strong>${Number(t.balanceAfter || 0).toLocaleString()} CFA</strong>

    </div>

   </div>

  `;

 }).join("");

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="ownerCashAccountPage()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>OWNER — CASH HISTORY</span>

  </div>

  <div class="panel">

   <span class="badge">

    📋 TRANSACTION HISTORY

   </span>

   <h1>Cash Account History</h1>

   <div class="summary" style="margin-bottom:20px">

    <div class="info-row">

     <span>Current Balance</span>

     <strong>

      ${Number(ownerCashAccount.balance || 0).toLocaleString()} CFA

     </strong>

    </div>

   </div>

   ${

    rows ||

    `<p class="muted">

      No cash account transactions yet.

     </p>`

   }

  </div>

 </div>`;

}
  function ownerExpenses(){

 clearInterval(timerInterval);

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="ownerHome()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>OWNER — EXPENSES</span>

  </div>

  <div class="panel">

   <span class="badge">

    🧾 EXPENSE TRACKING

   </span>

  function saveNewExpense(){
 if(role!=="owner" && role!=="manager"){

  alert("You do not have permission to add expenses.");

  render();

  return;

 }
 const categoryId=

  document.getElementById("expenseCategory").value;

 const amount=

  Number(document.getElementById("expenseAmount").value);

 const note=

  document.getElementById("expenseNote").value.trim();

 const reference=

  document.getElementById("expenseReference").value.trim();

 const category=

  expenseCategories.find(

   item=>item.id===categoryId

  );

 if(!category){

  alert("Please select an expense category.");

  return;

 }

 if(!Number.isFinite(amount) || amount<=0){

  alert("Please enter a valid expense amount.");

  return;

 }
const activeShift=getActiveShift();

if(activeShift){

 const shiftCash=

  calculateExpectedCash(activeShift);

 const ownerCash=

  Number(ownerCashAccount.balance || 0);

 if(amount>shiftCash){

  const requiredCash=

   amount-shiftCash;

  if(requiredCash>ownerCash){

   alert(

    "Not enough cash available in the Shift and Owner Cash Account."

   );

   return;

  }

  const transferConfirmed=

   confirm(

    "Insufficient Shift Cash\n\n"+

    "Shift available: "+

    shiftCash.toLocaleString()+" CFA\n"+

    "Expense: "+

    amount.toLocaleString()+" CFA\n"+

    "Transfer required from Owner Cash Account: "+

    requiredCash.toLocaleString()+" CFA\n\n"+

    "Transfer and pay this expense?"

   );

  if(!transferConfirmed){

   return;

  }

  const transferred=

   shiftCashIn(

    requiredCash,

    "Expense cash top-up: "+category.name

   );

  if(!transferred){

   return;

  }

 }

}
if(

 !activeShift &&

 amount>Number(ownerCashAccount.balance || 0)

){

 alert("Not enough cash in the Owner Cash Account.");

 return;

}
 const expense={

  id:

   "expense_"+

   Date.now()+"_"+

   Math.random()

    .toString(36)

    .slice(2,8),

  categoryId:category.id,

  categoryName:category.name,

  amount:amount,

  note:note,

  reference:reference,

  paymentMethod:"CASH",

  createdAt:Date.now(),

  createdBy:currentStaffName,

  createdByStaffId:currentStaffId,

  createdByRole:role,

  source:"MANUAL"

 };

 expenses.unshift(expense);

 saveExpenses();

 const shift=getActiveShift();

if(shift){

 shiftExpenseOut(

  amount,

  "Expense: "+category.name+

  (note ? " — "+note : "")

 );

}else{

 addOwnerCashTransaction(

  "OUT",

  amount,

  "Expense: "+category.name+

  (note ? " — "+note : ""),

  "EXPENSE"

 );

}

 alert("Expense saved successfully.");

 ownerExpenses();

}

const SHIFT_ACTIVE_KEY = "mrkActiveShift";

const SHIFT_HISTORY_KEY = "mrkShiftHistory";

function getActiveShift(){

  try{

    return JSON.parse(localStorage.getItem(SHIFT_ACTIVE_KEY)) || null;

  }catch(e){

    return null;

  }

}

function saveActiveShift(shift){

  localStorage.setItem(SHIFT_ACTIVE_KEY, JSON.stringify(shift));

}

function getShiftHistory(){

  try{

    return JSON.parse(localStorage.getItem(SHIFT_HISTORY_KEY)) || [];

  }catch(e){

    return [];

  }

}

function saveShiftHistory(history){

  localStorage.setItem(SHIFT_HISTORY_KEY, JSON.stringify(history));

}

function openShift(openingCash, openedBy="", role="cashier"){
  if(!canManageShift(role)){

    alert("Only a manager or owner can open a shift.");

    return false;

  }
  if(getActiveShift()){

    alert("A shift is already open.");

    return false;

  }

  openingCash = Number(openingCash);

  if(isNaN(openingCash) || openingCash < 0){

    alert("Enter a valid opening cash amount.");

    return false;

  }
  if(

 openingCash>

 Number(ownerCashAccount.balance || 0)

){

 alert("Not enough cash in the Owner Cash Account.");

 return false;

}
  const shift = {

    id: Date.now(),

    openedAt: new Date().toISOString(),

    closedAt: null,

    openedBy: openedBy,

    role: role,

    openingCash: openingCash,

    sales: 0,

    salesCount: 0,

    cashIn: 0,

    cashOut: 0,

    movements: [],

    orders: [],

    closingCashExpected: null,

    closingCashActual: null,

    difference: null,

    status: "open"

  };

  saveActiveShift(shift);
if(openingCash>0){

 addOwnerCashTransaction(

  "OUT",

  openingCash,

  "Opening cash transferred to shift",

  "SHIFT_OPEN"

 );

}
  return true;

}

function addShiftSale(amount, orderId=null, paymentMethod="CASH"){

  const shift = getActiveShift();

  if(!shift) return;
if(orderId !== null && (shift.orders || []).some(o => o.orderId === orderId)){

  return;

}
  amount = Number(amount);

if(!Number.isFinite(amount) || amount <= 0) return;

shift.sales = Number(shift.sales || 0) + amount;
if(shift.cashSales===undefined){

  shift.cashSales=(shift.orders || [])

    .filter(o=>!o.paymentMethod || o.paymentMethod==="CASH")

    .reduce((sum,o)=>sum+Number(o.amount || 0),0);

}

if(paymentMethod==="CASH"){

  shift.cashSales = Number(shift.cashSales || 0) + amount;

}
shift.salesCount = Number(shift.salesCount || 0) + 1;

if(!shift.orders) shift.orders = [];
    shift.orders.push({

    orderId: orderId,

    amount: amount,

    paymentMethod: paymentMethod,

    time: new Date().toISOString()

  });
  saveActiveShift(shift);

}
  
function shiftCashIn(amount, reason=""){

  if(!canManageShift(role)){

    alert("Only a manager or owner can add cash.");

    return false;

  }

  const shift = getActiveShift();

  if(!shift){

    alert("No shift is currently open.");

    return false;

  }

  amount = Number(amount);

  if(!Number.isFinite(amount) || amount <= 0){

    alert("Enter a valid amount.");

    return false;

  }
 if(

  amount >

  Number(ownerCashAccount.balance || 0)

){

  alert("Not enough cash in the Owner Cash Account.");

  return false;

}

addOwnerCashTransaction(

  "OUT",

  amount,

  "Cash transferred to active shift",

  "SHIFT_CASH_IN"

);
  shift.cashIn = Number(shift.cashIn || 0) + amount;

  if(!shift.movements) shift.movements = [];

  shift.movements.push({

    type: "in",

    amount: amount,

    reason: reason,

    time: new Date().toISOString()

  });

  saveActiveShift(shift);

}

function shiftCashOut(amount, reason=""){
  if(!canManageShift(role)){

    alert("Only a manager or owner can remove cash.");

    return false;

  }
  const shift = getActiveShift();

  if(!shift){

    alert("No shift is currently open.");

    return false;

  }

  amount = Number(amount);

  if(isNaN(amount) || amount <= 0){

    alert("Enter a valid amount.");

    return false;

  }
 if(

  amount >

  calculateExpectedCash(shift)

){

  alert("Not enough cash in the current shift.");

  return false;

}

addOwnerCashTransaction(

  "IN",

  amount,

  "Cash transferred from active shift"+

  (reason ? " — "+reason : ""),

  "SHIFT_CASH_OUT"

);
  shift.cashOut = Number(shift.cashOut || 0) + amount;

if(!shift.movements) shift.movements = [];
  shift.movements.push({

    type: "out",

    amount: amount,

    reason: reason,

    time: new Date().toISOString()

  });

  saveActiveShift(shift);

  return true;

}
function shiftExpenseOut(amount, reason=""){

  const shift=getActiveShift();

  if(!shift){

    alert("No shift is currently open.");

    return false;

  }

  amount=Number(amount);

  if(!Number.isFinite(amount) || amount<=0){

    alert("Enter a valid amount.");

    return false;

  }

  if(amount>calculateExpectedCash(shift)){

    alert("Not enough cash in the current shift.");

    return false;

  }

  shift.cashOut=

    Number(shift.cashOut || 0)+amount;

  if(!shift.movements){

    shift.movements=[];

  }

  shift.movements.push({

    type:"expense",

    amount:amount,

    reason:reason,

    time:new Date().toISOString()

  });

  saveActiveShift(shift);

  return true;

}
function calculateExpectedCash(shift){

  if(!shift) return 0;

  const cashSales=

    shift.cashSales!==undefined

    ?Number(shift.cashSales || 0)

    :(shift.orders || [])

      .filter(o=>!o.paymentMethod || o.paymentMethod==="CASH")

      .reduce((sum,o)=>sum+Number(o.amount || 0),0);

  return (

    Number(shift.openingCash || 0) +

    cashSales +

    Number(shift.cashIn || 0) -

    Number(shift.cashOut || 0)

  );

}

function closeShift(actualCash, closedBy="", closedRole=""){
  if(!canManageShift(closedRole)){

    alert("Only a manager or owner can close a shift.");

    return false;

  }
  const shift = getActiveShift();

  if(!shift){

    alert("No shift is currently open.");

    return false;

  }

  actualCash = Number(actualCash);

if(!Number.isFinite(actualCash) || actualCash < 0){

  alert("Enter a valid closing cash amount.");

  return false;

}

  const expectedCash = calculateExpectedCash(shift);

  shift.closingCashExpected = expectedCash;

  shift.closingCashActual = actualCash;

  shift.difference = actualCash - expectedCash;

  shift.closedAt = new Date().toISOString();

shift.closedBy = closedBy;

shift.closedRole = closedRole;

shift.status = "closed";

  const history = getShiftHistory();

  history.unshift(shift);

  saveShiftHistory(history);

  localStorage.removeItem(SHIFT_ACTIVE_KEY);
  if(actualCash>0){

 addOwnerCashTransaction(

  "IN",

  actualCash,

  "Cash transferred from closed shift",

  "SHIFT_CLOSE"

 );

}
  return shift;

}
  function getShiftSummary(){

  const shift = getActiveShift();

  if(!shift) return null;

  return {

    openingCash: Number(shift.openingCash || 0),

    sales: Number(shift.sales || 0),

    salesCount: Number(shift.salesCount || 0),

    cashIn: Number(shift.cashIn || 0),

    cashOut: Number(shift.cashOut || 0),

    expectedCash: calculateExpectedCash(shift),

    openedAt: shift.openedAt,

openedBy: shift.openedBy,

role: shift.role,

status: shift.status

  };

}

function canManageShift(role){

  role = String(role || "").toLowerCase();

  return role === "owner" || role === "manager";

}

function canViewShiftHistory(role){

function formatShiftDate(date){

    return "Over +" + formatShiftMoney(difference);

  return "Short " + formatShiftMoney(Math.abs(difference));

}

function getOrderInventoryNeeds(order){

 const needs={};

 function add(id,qty){

  if(!id||!qty)return;

  needs[id]=(needs[id]||0)+qty;

 }

 orderCart(order).forEach(item=>{

  const productQty=

   Number(item.qty||1);
const ownerItem=

 ownerMenuData.find(

  menuItem=>menuItem.name===item.name

 );

if(ownerItem){

 const removed=

  new Set(item.removed||[]);

 (ownerItem.ingredientIds||[])

  .forEach(ingredientId=>{

   const ingredient=

    menuIngredients.find(

     menuIngredient=>

      menuIngredient.id===ingredientId

    );

   if(

    !ingredient ||

    ingredient.tracked!==true ||

    ingredient.active===false ||

    removed.has(ingredient.name)

   ){

    return;

   }

   const recipeQty=

    Number(

     ownerItem.ingredientQuantities?.[ingredientId] ?? 1

    );

   add(

    ingredientId,

    recipeQty*productQty

   );

  });

}
  
 
(item.extras||[]).forEach(extra=>{

 const ownerExtra=

  ownerMenuData.find(

   menuItem=>

    menuItem.name===extra.name &&

    menuItem.active!==false

  );

 if(!ownerExtra){

  return;

 }

 (ownerExtra.ingredientIds||[])

  .forEach(ingredientId=>{

   const ingredient=

    menuIngredients.find(

     menuIngredient=>

      menuIngredient.id===ingredientId

    );

   if(

    !ingredient ||

    ingredient.tracked!==true ||

    ingredient.active===false

   ){

    return;

   }

   const recipeQty=

    Number(

     ownerExtra.ingredientQuantities?.[ingredientId] ?? 1

    );

   add(

    ingredientId,

    recipeQty *

    Number(extra.qty||0) *

    productQty

   );

  });

});
  

 });

 return needs;

}

 Object.entries(needs)

 .forEach(([id,qty])=>{

  const current=

   Number(inventoryStock[id]||0);

  if(current<qty){

   const item=

    inventoryItems.find(

     i=>i.id===id

    );

   missing.push(

    `${item?item.name:id}: need ${qty}, have ${current}`

   );

  }

 });

 return missing;

}

newStock:newStock,

/* TIMER */

function formatTimer(startedAt,stopAt){

 const start=

 Number(startedAt)||

 Date.now();

 const end=

 stopAt

 ?Number(stopAt)

 :Date.now();

 const seconds=

 Math.max(

   0,

   Math.floor(

     (end-start)/1000

   )

 );

 const h=

 Math.floor(seconds/3600);

 const m=

 Math.floor((seconds%3600)/60);

 const s=

 seconds%60;

 if(h>0){

   return `${

    String(h).padStart(2,"0")

   }:${

    String(m).padStart(2,"0")

   }:${

    String(s).padStart(2,"0")

   }`;

 }

 return `${

  String(m).padStart(2,"0")

 }:${

  String(s).padStart(2,"0")

 }`;

}

function updateVisibleTimers(){

 document

 .querySelectorAll(".timer")

 .forEach(el=>{

   el.textContent=

   formatTimer(

     el.dataset.start,

     el.dataset.stop||null

   );

 });

}

function startTimerRefresh(){

 clearInterval(timerInterval);

 updateVisibleTimers();

 timerInterval=

 setInterval(

   updateVisibleTimers,

   1000

 );

}
