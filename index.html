<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#111111">

<title>Mr K Burgers POS</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#111;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}

button,input{font:inherit}

button{cursor:pointer;border:1px solid #444;background:#252525;color:white;border-radius:12px;padding:15px 20px}

.primary{background:#f3a51b;color:#111;border-color:#f3a51b;font-weight:bold}

.secondary{background:#252525;color:white;border-color:#555;font-weight:bold}

.danger{background:#351b1b;border-color:#703434;color:#ffb0b0}

.green{background:#17351e;border-color:#397548;color:#b8ffc8;font-weight:bold}

.app{min-height:100vh;padding:24px;max-width:1100px;margin:auto}

.logo{font-size:28px;font-weight:800}

.logo span{display:block;color:#f3a51b;font-size:11px;letter-spacing:3px;margin-top:4px}

.panel{background:#1b1b1b;border:1px solid #373737;border-radius:16px;padding:20px;margin-top:18px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}

.card{background:#242424;border:1px solid #373737;border-radius:14px;padding:20px}

.clickable{cursor:pointer;transition:.15s}

.clickable:active{transform:scale(.98)}

.category{min-height:150px;text-align:left}

.category-icon{font-size:38px;margin-bottom:12px}

.form{display:grid;gap:12px;max-width:550px}

input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:white}

.muted{color:#aaa}

.badge{color:#f3a51b;font-size:11px;font-weight:bold;letter-spacing:1px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}

.loginbox{width:min(430px,100%);background:#191919;border:1px solid #373737;border-radius:18px;padding:30px}

.back{margin-bottom:20px}

.qty{display:flex;align-items:center;gap:15px}

.qty button{width:48px;height:48px;padding:0;font-size:24px}

.qty strong{min-width:30px;text-align:center;font-size:24px}

.extra-row{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#202020;border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:10px 0}

.extra-name{flex:1;font-weight:bold}

.extra-qty{display:flex;align-items:center;gap:10px}

.extra-qty button{width:42px;height:42px;padding:0;font-size:22px}

.extra-qty strong{min-width:28px;text-align:center;font-size:20px}

.ingredient-row{display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:8px 0}

.ingredient-row input{width:22px;height:22px;accent-color:#f3a51b;flex:0 0 auto}

.ingredient-row label{font-weight:bold;flex:1}

.no-item{color:#ff9b9b;font-weight:bold;margin-top:5px}

.summary{background:#101010;border:1px solid #3b3b3b;border-radius:14px;padding:18px;margin-top:18px}

.order-card{background:#202020;border:1px solid #3b3b3b;border-radius:16px;padding:18px;margin:14px 0}

.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}

.order-number{font-size:22px;font-weight:bold}

.timer{font-size:24px;font-weight:800;color:#f3a51b;font-variant-numeric:tabular-nums}

.status{display:inline-block;background:#302715;border:1px solid #6c5220;color:#f3a51b;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}

.status.ready{background:#17351e;border-color:#397548;color:#b8ffc8}

.status.completed{background:#252525;border-color:#555;color:#bbb}

.draft-status{display:inline-block;background:#1c2730;border:1px solid #3e6176;color:#8ccdf3;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}

.info-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #333}

.info-row:last-child{border-bottom:none}

.system-note{border-left:4px solid #f3a51b;padding:12px 14px;background:#181818;margin-top:12px;color:#bbb}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}

.actions button{flex:1;min-width:150px}

.cart-count{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#f3a51b;color:#111;font-size:11px;font-weight:bold}

.kitchen-title{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}

.kitchen-item{font-size:18px;font-weight:bold;padding:10px 0;border-bottom:1px solid #333}

.kitchen-item:last-child{border-bottom:none}

@media(max-width:700px){

  .app{padding:16px}

  .grid{grid-template-columns:1fr}

  .order-top{flex-direction:column}

}

</style>

</head>

<body>

<div id="root"></div>

<script>

let loggedIn=false;

let role="";

let orderType="";

let currentCategory="";

let currentQty=1;

let currentExtraQty={};

let currentRemovedIngredients=[];

let currentDraftId=null;

let cart=[];

let customer={name:"",phone:"",address:"",table:""};

let activeOrders=safeLoad("mrkActiveOrders",[]);

let draftOrders=safeLoad("mrkDraftOrders",[]);

let completedOrders=safeLoad("mrkCompletedOrders",[]);

let nextOrderNumber=Number(localStorage.getItem("mrkNextOrderNumber")||"1");

let timerInterval=null;

const burgers=[

 "Mr K Classic","Mushroom & Swiss","Honky Tonk","Philly Cheesesteak",

 "Only The Brave","Bohemian","Chicken Chimichurri"

];

const sides=[

 "French Fries","Plantain Tostones","Onion Rings","Cheese Fries",

 "Fajita Cheese Fries","Dirty Fries"

];

const salads=["Mr K Coleslaw","Cheeseburger Salad"];

const drinks=["Small Water","Big Water","Coca Cola","Sprite","Fanta"];

const sauces=["Mr K Sauce","Chimichurri","Ketchup","Mayonnaise","Honey Mustard","Honey BBQ"];

const burgerDetails={

 "Mr K Classic":{

   meat:"beef",

   ingredients:["Beef steak 120g","Burger bun","Rocket lettuce","Tomato","Onions","Pickled cucumbers","Mr K sauce"]

 },

 "Mushroom & Swiss":{

   meat:"beef",

   ingredients:["Beef steak 120g","Burger bun","Mushrooms","Swiss cheese","Rocket lettuce","Sauce"]

 },

 "Honky Tonk":{

   meat:"beef",

   ingredients:["Beef steak 120g","Burger bun","Bacon","Swiss cheese","Cheddar cheese","Rocket lettuce","Sauce","Onion rings"]

 },

 "Philly Cheesesteak":{

   meat:"beef",

   ingredients:["Beef steak 120g","Burger bun","Mozzarella cheese","Cheddar cheese","Sautéed beef tenderloin 100g","Rocket lettuce","Sauce"]

 },

 "Only The Brave":{

   meat:"beef",

   ingredients:["Beef steak 120g ×3","Burger bun","Cheddar cheese ×3","Bacon","Rocket lettuce","Sauce"]

 },

 "Bohemian":{

   meat:"beef",

   ingredients:["Beef steak 120g","Burger bun","Mozzarella cheese","Smoked turkey","Rocket lettuce","Sauce"]

 },

 "Chicken Chimichurri":{

   meat:"chicken",

   ingredients:["Chicken steak 120g","Burger bun","Mozzarella cheese","Cheddar cheese","Chimichurri","Rocket lettuce","Sauce"]

 }

};

const beefExtras=[

 "Extra beef patty","Extra cheddar cheese","Extra mozzarella cheese",

 "Extra Swiss cheese","Extra mushroom","Extra onion rings","Extra bacon"

];

const chickenExtras=[

 "Extra chicken steak","Extra cheddar cheese","Extra mozzarella cheese",

 "Extra Swiss cheese","Extra mushroom","Extra onion rings","Extra bacon"

];

const loadedFries=["Cheese Fries","Fajita Cheese Fries","Dirty Fries"];

function safeLoad(key,fallback){

 try{

   const v=JSON.parse(localStorage.getItem(key)||"null");

   return Array.isArray(v)?v:fallback;

 }catch(e){

   return fallback;

 }

}

function esc(v){

 return String(v||"")

 .replace(/&/g,"&amp;")

 .replace(/"/g,"&quot;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;");

}

function padOrder(n){

 return String(n).padStart(3,"0");

}

function orderCart(o){

 if(Array.isArray(o.cart))return o.cart;

 if(Array.isArray(o.items))return o.items;

 return [];

}

function orderLabel(o){

 if(o.type==="DINE IN"){

   if(o.customer&&o.customer.table)return `Table ${o.customer.table}`;

   return o.customer?.name||"Dine In";

 }

 return o.customer?.name||o.type||"Order";

}

function currentCustomerLabel(){

 return orderType==="DINE IN"?`Table ${customer.table}`:customer.name;

}

function formatDateTime(timestamp){

 if(!timestamp)return "—";

 try{

   return new Date(Number(timestamp)).toLocaleString();

 }catch(e){

   return "—";

 }

}

function prepDuration(o){

 if(!o.startedAt||!o.readyAt)return "—";

 return formatTimer(o.startedAt,o.readyAt);

}

function saveOrders(){

 localStorage.setItem("mrkActiveOrders",JSON.stringify(activeOrders));

 localStorage.setItem("mrkDraftOrders",JSON.stringify(draftOrders));

 localStorage.setItem("mrkCompletedOrders",JSON.stringify(completedOrders));

 localStorage.setItem("mrkNextOrderNumber",String(nextOrderNumber));

}

function render(){

 if(!loggedIn)return loginScreen();

 if(role==="kitchen")return kitchenHome();
 if(role==="manager")return managerHome();
 home();

}

function loginScreen(){

 document.getElementById("root").innerHTML=`

 <div class="login">

  <div class="loginbox">

   <div class="logo">MR K BURGERS<span>POS SYSTEM</span></div>

   <div class="form" style="margin-top:30px">

    <label>Staff ID</label>

    <input id="user" placeholder="Staff ID">

    <label>PIN</label>

    <input id="pin" type="password" placeholder="PIN">

    <button class="primary" onclick="login()">LOGIN</button>

   </div>

   <p class="muted" style="margin-top:20px">

    Cashier: cashier01<br>

    Kitchen: kitchen01<br>
    Manager: manager01

   </p>

  </div>

 </div>`;

}

function login(){

 const u=document.getElementById("user").value.trim();

 const p=document.getElementById("pin").value.trim();

 if(u==="cashier01"&&p==="1234"){

   loggedIn=true;

   role="cashier";

   home();

   return;

 }

 if(u==="kitchen01"&&p==="5678"){

   loggedIn=true;

   role="kitchen";

   kitchenHome();

   return;

 }
if(u==="manager01"&&p==="9012"){

 loggedIn=true;

 role="manager";

 managerHome();

 return;

}
 alert("Invalid Staff ID or PIN.");

}

function logout(){

 loggedIn=false;

 role="";

 clearInterval(timerInterval);

 render();

}

function header(label){

 return `

 <div class="logo">MR K BURGERS<span>${label}</span></div>

 <button class="secondary" onclick="logout()">LOG OUT</button>`;

}
function managerHome(){

 clearInterval(timerInterval);

 document.getElementById("root").innerHTML=`

 <div class="app">

  <div class="kitchen-title">

   ${header("MANAGER")}

  </div>

  <div class="panel">

   <span class="badge">

    👔 MANAGER DASHBOARD

   </span>

   <h1>Management</h1>

   <div class="grid">

    <div class="card">

     <div class="category-icon">📦</div>

     <h3>ACTIVE ORDERS</h3>

     <strong>${activeOrders.length}</strong>

    </div>

    <div class="card">

     <div class="category-icon">📜</div>

     <h3>ORDER HISTORY</h3>

     <strong>${completedOrders.length}</strong>

    </div>

    <div class="card">

     <div class="category-icon">💰</div>

     <h3>SALES</h3>

     <p class="muted">Coming soon</p>

    </div>

    <div class="card">

     <div class="category-icon">📅</div>

     <h3>SALES HISTORY</h3>

     <p class="muted">Coming soon</p>

    </div>

    <div class="card">

     <div class="category-icon">📦</div>

     <h3>INVENTORY</h3>

     <p class="muted">Coming soon</p>

    </div>

    <div class="card">

     <div class="category-icon">🚫</div>

     <h3>PRODUCT AVAILABILITY</h3>

     <p class="muted">Coming soon</p>

    </div>

   </div>

  </div>

 </div>`;

}
/* CASHIER HOME */

function home(){

 clearInterval(timerInterval);

 const newest=[...activeOrders]

 .sort((a,b)=>Number(b.number)-Number(a.number));

 document.getElementById("root").innerHTML=`

 <div class="app">

  <div class="kitchen-title">

   ${header("CASHIER POS")}

  </div>

  <div class="panel">

   <div class="grid">

    <div class="card clickable" onclick="newOrder()">

     <div class="category-icon">🧾</div>

     <h3>NEW ORDER</h3>

    </div>

    <div class="card clickable" onclick="showDraftOrders()">

     <div class="category-icon">⏸️</div>

     <h3>ORDERS IN PROGRESS</h3>

     <strong>${draftOrders.length}</strong>

    </div>

    <div class="card clickable" onclick="showActiveOrders()">

     <div class="category-icon">🔥</div>

     <h3>ACTIVE ORDERS</h3>

     <strong>${activeOrders.length}</strong>

    </div>

    <div class="card clickable" onclick="showOrderHistory()">

     <div class="category-icon">📜</div>

     <h3>ORDER HISTORY</h3>

     <strong>${completedOrders.length}</strong>

    </div>

   </div>

  </div>

  <div class="panel">

   <span class="badge">LIVE KITCHEN ORDERS</span>

   <h2>Current Orders</h2>

   ${

    newest.length

    ?newest.map(cashierOrderCard).join("")

    :`<p class="muted">No active orders.</p>`

   }

  </div>

 </div>`;

 startTimerRefresh();

}

function cashierOrderCard(o){

 return `

 <div class="order-card clickable" onclick="activeOrderDetail(${Number(o.number)})">

  <div class="order-top">

   <div>

    <div class="order-number">#${padOrder(o.number)}</div>

    <strong>${esc(orderLabel(o))}</strong><br>

    <span class="muted">${esc(o.type)}</span>

   </div>

   <div style="text-align:right">

    <div

     class="timer"

     data-start="${o.startedAt||Date.now()}"

     data-stop="${o.readyAt||""}">

     ${formatTimer(o.startedAt||Date.now(),o.readyAt)}

    </div>

    <span class="status ${o.status==="READY"?"ready":""}">

     ${esc(o.status||"NEW")}

    </span>

   </div>

  </div>

 </div>`;

}

/* ORDER HISTORY */

function showOrderHistory(){

 clearInterval(timerInterval);

 const history=[...completedOrders]

 .sort((a,b)=>Number(b.completedAt||0)-Number(a.completedAt||0));

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button class="back" onclick="home()">← BACK</button>

  <div class="logo">

   MR K BURGERS

   <span>ORDER HISTORY</span>

  </div>

  <div class="panel">

   <span class="badge">COMPLETED ORDERS</span>

   <h2>Order History</h2>

   ${

    history.length

    ?history.map(historyCard).join("")

    :`<p class="muted">No completed orders yet.</p>`

   }

  </div>

 </div>`;

}

function historyCard(o){

 const index=completedOrders.indexOf(o);

 return `

 <div

  class="order-card clickable"

  onclick="completedOrderDetail(${index})">

  <div class="order-top">

   <div>

    <div class="order-number">

     #${padOrder(o.number)}

    </div>

    <strong>

     ${esc(orderLabel(o))}

    </strong>

    <br>

    <span class="muted">

     ${esc(o.type)}

    </span>

   </div>

   <div style="text-align:right">

    <span class="status completed">

     COMPLETED

    </span>

    <div class="muted" style="margin-top:10px">

     ${esc(formatDateTime(o.completedAt))}

    </div>

    <div style="margin-top:7px">

     Prep: <strong>${esc(prepDuration(o))}</strong>

    </div>

   </div>

  </div>

 </div>`;

}

function completedOrderDetail(index){

 const o=completedOrders[index];

 if(!o){

   return showOrderHistory();

 }

 const items=orderCart(o);

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button class="back" onclick="showOrderHistory()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>COMPLETED ORDER</span>

  </div>

  <div class="panel">

   <div class="order-top">

    <div>

     <div class="order-number">

      #${padOrder(o.number)}

     </div>

     <h2>

      ${esc(orderLabel(o))}

     </h2>

    </div>

    <span class="status completed">

     COMPLETED

    </span>

   </div>

   <div class="info-row">

    <span>Order Type</span>

    <strong>${esc(o.type)}</strong>

   </div>

   ${

    o.type==="DINE IN"

    ?`

     <div class="info-row">

      <span>Table Number</span>

      <strong>${esc(o.customer?.table)}</strong>

     </div>

    `

    :`

     <div class="info-row">

      <span>Customer</span>

      <strong>${esc(o.customer?.name)}</strong>

     </div>

     ${

      o.customer?.phone

      ?`

       <div class="info-row">

        <span>Phone</span>

        <strong>${esc(o.customer.phone)}</strong>

       </div>

      `

      :""

     }

     ${

      o.type==="DELIVERY"&&o.customer?.address

      ?`

       <div class="info-row">

        <span>Address</span>

        <strong>${esc(o.customer.address)}</strong>

       </div>

      `

      :""

     }

    `

   }

   <div class="info-row">

    <span>Completed</span>

    <strong>${esc(formatDateTime(o.completedAt))}</strong>

   </div>

   <div class="info-row">

    <span>Final Prep Time</span>

    <strong>${esc(prepDuration(o))}</strong>

   </div>

   <h3>Items</h3>

   ${

    items.length

    ?items.map(i=>`

     <div class="summary">

      <strong>

       ${i.qty} × ${esc(i.name)}

      </strong>

      ${removedHtml(i)}

      ${

       (i.extras||[])

       .map(e=>`

        <div class="muted">

         ${e.qty} × ${esc(e.name)}

        </div>

       `)

       .join("")

      }

     </div>

    `).join("")

    :`<p class="muted">No item details available.</p>`

   }

   <div class="system-note">

    📜 Completed orders are read-only.

   </div>

  </div>

 </div>`;

}

/* NEW ORDER */

function newOrder(){

 orderType="";

 currentDraftId=null;

 cart=[];

 customer={

  name:"",

  phone:"",

  address:"",

  table:""

 };

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button class="back" onclick="home()">← BACK</button>

  <div class="logo">

   MR K BURGERS

   <span>NEW ORDER</span>

  </div>

  <div class="panel">

   <h2>Select Order Type</h2>

   <div class="grid">

    <div class="card category clickable" onclick="selectOrderType('DINE IN')">

     <div class="category-icon">🍽️</div>

     <h3>DINE IN</h3>

    </div>

    <div class="card category clickable" onclick="selectOrderType('TAKEAWAY')">

     <div class="category-icon">🥡</div>

     <h3>TAKEAWAY</h3>

    </div>

    <div class="card category clickable" onclick="selectOrderType('DELIVERY')">

     <div class="category-icon">🛵</div>

     <h3>DELIVERY</h3>

    </div>

   </div>

  </div>

 </div>`;

}

function selectOrderType(t){

 orderType=t;

 customerForm();

}

function customerForm(){

 let fields="";

 if(orderType==="DINE IN"){

  fields=`

  <label>Table Number</label>

  <input

   id="table"

   inputmode="numeric"

   value="${esc(customer.table)}"

   placeholder="Example: 6">`;

 }

 else if(orderType==="TAKEAWAY"){

  fields=`

  <label>Customer Name</label>

  <input

   id="name"

   value="${esc(customer.name)}">

  <label>Phone Number (optional)</label>

  <input

   id="phone"

   value="${esc(customer.phone)}"

   placeholder="+223">`;

 }

 else{

  fields=`

  <label>Customer Name</label>

  <input

   id="name"

   value="${esc(customer.name)}">

  <label>Phone Number</label>

  <input

   id="phone"

   value="${esc(customer.phone)}"

   placeholder="+223">

  <label>Delivery Address</label>

  <input

   id="address"

   value="${esc(customer.address)}">`;

 }

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button class="back" onclick="newOrder()">← BACK</button>

  <div class="logo">

   MR K BURGERS

   <span>${orderType}</span>

  </div>

  <div class="panel">

   <h2>Order Details</h2>

   <div class="form">

    ${fields}

    <button

     class="primary"

     onclick="saveCustomer()">

     CONTINUE TO MENU

    </button>

   </div>

  </div>

 </div>`;

}

function saveCustomer(){

 if(orderType==="DINE IN"){

   const table=

   document.getElementById("table").value.trim();

   if(!table){

     return alert("Enter the table number.");

   }

   customer={

     name:"",

     phone:"",

     address:"",

     table

   };

 }

 else if(orderType==="TAKEAWAY"){

   const name=

   document.getElementById("name").value.trim();

   if(!name){

     return alert("Enter the customer name.");

   }

   customer={

     name,

     phone:document.getElementById("phone").value.trim(),

     address:"",

     table:""

   };

 }

 else{

   const name=

   document.getElementById("name").value.trim();

   const phone=

   document.getElementById("phone").value.trim();

   const address=

   document.getElementById("address").value.trim();

   if(!name||!phone||!address){

     return alert("Complete all delivery details.");

   }

   customer={

     name,

     phone,

     address,

     table:""

   };

 }

 menuCategories();

}

/* MENU */

function menuCategories(){

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button class="back" onclick="customerForm()">← BACK</button>

  <div class="logo">

   MR K BURGERS

   <span>MENU</span>

  </div>

  <div class="panel">

   <div class="grid">

    ${cat("🍔","Burgers")}

    ${cat("🍟","Sides")}

    ${cat("🥗","Salads")}

    ${cat("🥤","Soft Drinks")}

    ${cat("🥫","Extra Sauces")}

   </div>

   <div class="actions">

    <button

     class="secondary"

     onclick="viewCart()">

     VIEW ORDER

     <span class="cart-count">

      ${cart.reduce((a,b)=>a+Number(b.qty||0),0)}

     </span>

    </button>

    <button

     class="secondary"

     onclick="saveAndHoldOrder()">

     SAVE & HOLD

    </button>

   </div>

  </div>

 </div>`;

}

function cat(icon,name){

 return `

 <div

  class="card category clickable"

  onclick="openCategory('${name}')">

  <div class="category-icon">

   ${icon}

  </div>

  <h3>${name}</h3>

 </div>`;

}

function openCategory(name){

 currentCategory=name;

 let items=

 name==="Burgers"?burgers:

 name==="Sides"?sides:

 name==="Salads"?salads:

 name==="Soft Drinks"?drinks:

 sauces;

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="menuCategories()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>${name.toUpperCase()}</span>

  </div>

  <div class="panel">

   <div class="grid">

    ${

     items.map(i=>`

      <div

       class="card clickable"

       onclick='selectItem(${JSON.stringify(i)})'>

       <h3>${i}</h3>

      </div>

     `).join("")

    }

  </div>

}

function selectItem(name){

 currentQty=1;

 if(burgerDetails[name]){

   return burgerCustomize(name);

 }

 if(loadedFries.includes(name)){

   return loadedCustomize(name);

 }

 simpleItem(name);

}

/* CUSTOMIZATION */

function resetExtras(extras){

 currentExtraQty={};

 extras.forEach(e=>{

   currentExtraQty[e]=0;

 });

}

function resetIngredients(){

 currentRemovedIngredients=[];

}

function safeId(t){

 return "x"+t.replace(/[^a-zA-Z0-9]/g,"");

}

function ingredientId(i){

 return "ing"+i;

}

function ingredientRows(ingredients){

 return ingredients.map((ingredient,index)=>`

 <div class="ingredient-row">

  <input

   type="checkbox"

   id="${ingredientId(index)}"

   checked

   onchange='toggleIngredient(${JSON.stringify(ingredient)},this.checked)'>

  <label for="${ingredientId(index)}">

   ${esc(ingredient)}

  </label>

 </div>`).join("");

}

function toggleIngredient(ingredient,isChecked){

 if(isChecked){

   currentRemovedIngredients=

   currentRemovedIngredients.filter(

     x=>x!==ingredient

   );

 }else{

   if(!currentRemovedIngredients.includes(ingredient)){

     currentRemovedIngredients.push(ingredient);

   }

 }

}

function extraRows(extras){

 return extras.map(e=>`

 <div class="extra-row">

  <div class="extra-name">

   ${e}

  </div>

  <div class="extra-qty">

   <button

    onclick='changeExtraQty(${JSON.stringify(e)},-1)'>

    −

   </button>

   <strong id="${safeId(e)}">

    ${currentExtraQty[e]||0}

   </strong>

   <button

    onclick='changeExtraQty(${JSON.stringify(e)},1)'>

    +

   </button>

  </div>

 </div>`).join("");

}

function changeExtraQty(e,n){

 currentExtraQty[e]=Math.max(

   0,

   (currentExtraQty[e]||0)+n

 );

 const el=document.getElementById(safeId(e));

 if(el){

   el.textContent=currentExtraQty[e];

 }

}

function burgerCustomize(name){

 const d=burgerDetails[name];

 const extras=

 d.meat==="chicken"

 ?chickenExtras

 :beefExtras;

 resetExtras(extras);

 resetIngredients();

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="openCategory('Burgers')">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>CUSTOMIZE</span>

  </div>

  <div class="panel">

   <h2>${name}</h2>

   <h3>Ingredients</h3>

   <p class="muted">

    Uncheck any ingredient the customer does not want.

   </p>

   ${ingredientRows(d.ingredients)}

   <h3>Extras</h3>

   ${extraRows(extras)}

   <h3>PRODUCT QUANTITY</h3>

   <button

    class="primary"

    style="margin-top:20px;width:100%"

    onclick='addCustomizedItem(${JSON.stringify(name)})'>

    ADD TO ORDER

   </button>

  </div>

 </div>`;

}

  <div class="logo">

function simpleItem(name){

 currentRemovedIngredients=[];

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="openCategory('${currentCategory}')">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>ADD ITEM</span>

  </div>

function qtyHtml(){

 return `

 <div class="qty">

  <button onclick="changeQty(-1)">−</button>

  <strong id="qty">

   ${currentQty}

  </strong>

  <button onclick="changeQty(1)">+</button>

 </div>`;

}

function changeQty(n){

 currentQty=Math.max(

   1,

   currentQty+n

 );

 const el=document.getElementById("qty");

 if(el){

   el.textContent=currentQty;

 }

}

function addCustomizedItem(name){

 const extras=

 Object.entries(currentExtraQty)

 .filter(([n,q])=>q>0)

 .map(([name,qty])=>({

   name,

   qty

 }));

 cart.push({

   name,

   qty:currentQty,

   extras,

   removed:[...currentRemovedIngredients]

 });

 currentRemovedIngredients=[];

 menuCategories();

}

function addSimpleItem(name){

 cart.push({

   name,

   qty:currentQty,

   extras:[],

   removed:[]

 });

 menuCategories();

}

/* CART */

function removedHtml(i){

 return (i.removed||[])

 .map(r=>`

  <div class="no-item">

   NO ${esc(String(r).toUpperCase())}

  </div>

 `)

 .join("");

}

function viewCart(){

 document.getElementById("root").innerHTML=`

 <div class="app">

   class="back"

   onclick="menuCategories()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>ORDER SUMMARY</span>

  </div>

  <div class="panel">

   <h2>

    ${orderType}

    —

    ${esc(currentCustomerLabel())}

   </h2>

   ${

    cart.length

    ?cart.map((i,index)=>`

     <div class="summary">

      <strong>

       ${i.qty} × ${esc(i.name)}

      </strong>

      ${removedHtml(i)}

      ${

       (i.extras||[])

       .map(e=>`

}

function removeCartItem(i){

 cart.splice(i,1);

 viewCart();

}

/* SAVE & HOLD */

function saveAndHoldOrder(){

 if(!cart.length){

   return alert("Add at least one item first.");

 }

 const draft={

   id:currentDraftId||Date.now(),

   type:orderType,

   customer:{...customer},

   cart:JSON.parse(JSON.stringify(cart)),

   savedAt:Date.now()

 };

 const ix=

 draftOrders.findIndex(

   d=>d.id===draft.id

 );

 if(ix>=0){

   draftOrders[ix]=draft;

 }else{

   draftOrders.push(draft);

 }

 currentDraftId=draft.id;

 saveOrders();

 currentDraftId=null;

 cart=[];

 customer={

   name:"",

   phone:"",

   address:"",

   table:""

 };

 orderType="";

 home();

}

function showDraftOrders(){

 document.getElementById("root").innerHTML=`

 <div class="app">

  <button

   class="back"

   onclick="home()">

   ← BACK

  </button>

  <div class="logo">

   MR K BURGERS

   <span>ORDERS IN PROGRESS</span>

  </div>

  <div class="panel">

   ${

    draftOrders.length

    ?draftOrders.map(d=>`

     <div

      class="order-card clickable"

      onclick="resumeDraft(${d.id})">

      <span class="draft-status">

       ON HOLD

      </span>

      <h3>

       ${esc(orderLabel(d))}

      </h3>

      <div class="muted">

       ${esc(d.type)}

       •

       ${

        orderCart(d)

        .reduce(

          (a,b)=>a+Number(b.qty||0),

          0

        )

       }

      </div>

     </div>

    `).join("")

    :`<p class="muted">No orders on hold.</p>`

   }

 </div>`;

}

function resumeDraft(id){

 const d=

 draftOrders.find(

   x=>x.id===id

 );

 if(!d){

   return;

 }

 currentDraftId=d.id;

 orderType=d.type;

 customer={

   ...d.customer

 };

 cart=

 JSON.parse(

   JSON.stringify(

     orderCart(d)

   )

 );

 menuCategories();

}

 if(!cart.length){

 if(currentDraftId){

   draftOrders=

   draftOrders.filter(

     d=>d.id!==currentDraftId

   );

 }

   number:nextOrderNumber++,

   type:orderType,

   customer:{...customer},

   cart:JSON.parse(JSON.stringify(cart)),

   startedAt:Date.now(),

   readyAt:null,

   completedAt:null,

   status:"NEW"

 };

 activeOrders.push(order);

 saveOrders();

 currentDraftId=null;

 cart=[];

 customer={

   name:"",

   phone:"",

   address:"",

   table:""

 };

 orderType="";

 document.getElementById("root").innerHTML=`

  </button>

   MR K BURGERS

   <span>ACTIVE ORDER</span>

  </div>

     <div class="order-number">

      #${padOrder(o.number)}

   ${

    o.type==="DINE IN"

    ?`

      <span>Table Number</span>

      <strong>${esc(o.customer?.table)}</strong>

     </div>

    `

    :`

     <div class="info-row">

      <span>Customer</span>

      <strong>${esc(o.customer?.name)}</strong>

     </div>

     ${

      o.customer?.phone

      ?`

       <div class="info-row">

        <span>Phone</span>

        <strong>${esc(o.customer.phone)}</strong>

       </div>

      `

      :""

     }

     ${

      o.type==="DELIVERY"&&

      o.customer?.address

      ?`

       <div class="info-row">

        <span>Address</span>

        <strong>${esc(o.customer.address)}</strong>

      `

      :""

     }

    `

   }

   <h3>Items</h3>

   ${

    ?items.map(i=>`

     <div class="summary">

      <strong>

      ${removedHtml(i)}

      ${

       (i.extras||[])

       .map(e=>`

        <div class="muted">

         ${e.qty} × ${esc(e.name)}

        </div>

       `)

       .join("")

      }

     </div>

    :`<p class="muted">No item details available.</p>`

   }

   ${

    o.status==="READY"

    ?`

     <div class="system-note">

      ✅ Kitchen has marked this order READY.

     <button

      onclick="cashierCompleteOrder(${Number(o.number)})">

    :`

      the kitchen marks them READY.

    `

  </div>

 </div>`;

 startTimerRefresh();

}

function cashierCompleteOrder(number){

 const ix=

 activeOrders.findIndex(

   x=>

   Number(x.number)===

   Number(number)

 );

 if(ix<0){

   return home();

 }

 const o=

 activeOrders[ix];

 if(o.status!=="READY"){

   return alert(

     "Kitchen must mark the order READY first."

   );

 }

 o.status="COMPLETED";

 o.completedAt=Date.now();

 completedOrders.push(o);

 activeOrders.splice(ix,1);

 saveOrders();

 home();

}

 activeOrders.find(

   x=>

   Number(x.number)===

   Number(number)

 );

   return;

 }

 o.status="PREPARING";

 saveOrders();

function setReady(number){

 activeOrders.find(

   x=>

   Number(x.number)===

   Number(number)

 );

 if(!o){

   return;

 }

 o.status="READY";

 o.readyAt=Date.now();

 saveOrders();

 kitchenHome();

}

/* TIMER */

function formatTimer(startedAt,stopAt){

 const start=

 Number(startedAt)||

 Date.now();

 const end=

 stopAt

 ?Number(stopAt)

 :Date.now();

 const seconds=

 Math.max(

   0,

   Math.floor(

     (end-start)/1000

   )

 );

 const h=

 Math.floor(seconds/3600);

 const m=

 Math.floor((seconds%3600)/60);

 const s=

 seconds%60;

 if(h>0){

   return `${

    String(h).padStart(2,"0")

   }:${

    String(m).padStart(2,"0")

   }:${

    String(s).padStart(2,"0")

   }`;

 }

 return `${

  String(m).padStart(2,"0")

 }:${

  String(s).padStart(2,"0")

 }`;

}

function updateVisibleTimers(){

 document

 .querySelectorAll(".timer")

 .forEach(el=>{

   el.textContent=

   formatTimer(

     el.dataset.start,

     el.dataset.stop||null

   );

 });

}

function startTimerRefresh(){

 clearInterval(timerInterval);

 updateVisibleTimers();

 timerInterval=

 setInterval(

   updateVisibleTimers,

   1000

 );

}

window.addEventListener(

 e=>{

   ![

   ].includes(e.key)
