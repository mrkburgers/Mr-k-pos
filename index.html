<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#111111">

<title>Mr K Burgers POS</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#111;

  color:#f5f1e8;

  font-family:Arial,Helvetica,sans-serif;

}

button,input{font:inherit}

button{

  cursor:pointer;

  border:1px solid #444;

  background:#252525;

  color:white;

  border-radius:12px;

  padding:15px 20px;

}

.primary{

  background:#f3a51b;

  color:#111;

  border-color:#f3a51b;

  font-weight:bold;

}

.secondary{

  background:#252525;

  color:white;

  border-color:#555;

  font-weight:bold;

}

.danger{

  background:#351b1b;

  border-color:#703434;

  color:#ffb0b0;

}

.app{

  min-height:100vh;

  padding:24px;

  max-width:1100px;

  margin:auto;

}

.logo{

  font-size:28px;

  font-weight:800;

}

.logo span{

  display:block;

  color:#f3a51b;

  font-size:11px;

  letter-spacing:3px;

  margin-top:4px;

}

.panel{

  background:#1b1b1b;

  border:1px solid #373737;

  border-radius:16px;

  padding:20px;

  margin-top:18px;

}

.grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;

}

.card{

  background:#242424;

  border:1px solid #373737;

  border-radius:14px;

  padding:20px;

}

.clickable{

  cursor:pointer;

  transition:.15s;

}

.clickable:active{

  transform:scale(.98);

}

.category{

  min-height:150px;

  text-align:left;

}

.category-icon{

  font-size:38px;

  margin-bottom:12px;

}

.form{

  display:grid;

  gap:12px;

  max-width:550px;

}

input{

  width:100%;

  padding:14px;

  border-radius:10px;

  border:1px solid #444;

  background:#0d0d0d;

  color:white;

}

.muted{color:#aaa}

.badge{

  color:#f3a51b;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.login{

  min-height:100vh;

  display:grid;

  place-items:center;

  padding:20px;

}

.loginbox{

  width:min(430px,100%);

  background:#191919;

  border:1px solid #373737;

  border-radius:18px;

  padding:30px;

}

.back{

  margin-bottom:20px;

}

.option{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:12px;

  padding:14px;

  margin:10px 0;

}

.option input{

  width:22px;

  height:22px;

}

.qty{

  display:flex;

  align-items:center;

  gap:15px;

}

.qty button{

  width:48px;

  height:48px;

  padding:0;

  font-size:24px;

}

.qty strong{

  min-width:30px;

  text-align:center;

  font-size:24px;

}

.extra-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:12px;

  padding:14px;

  margin:10px 0;

}

.extra-name{

  flex:1;

  font-weight:bold;

}

.extra-qty{

  display:flex;

  align-items:center;

  gap:10px;

}

.extra-qty button{

  width:42px;

  height:42px;

  padding:0;

  font-size:22px;

}

.extra-qty strong{

  min-width:28px;

  text-align:center;

  font-size:20px;

}

.summary{

  background:#101010;

  border:1px solid #3b3b3b;

  border-radius:14px;

  padding:18px;

  margin-top:18px;

}

.order-card{

  background:#202020;

  border:1px solid #3b3b3b;

  border-radius:16px;

  padding:18px;

  margin:14px 0;

}

.order-top{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:15px;

}

.order-number{

  font-size:22px;

  font-weight:bold;

}

.timer{

  font-size:24px;

  font-weight:800;

  color:#f3a51b;

  font-variant-numeric:tabular-nums;

}

.status{

  display:inline-block;

  background:#302715;

  border:1px solid #6c5220;

  color:#f3a51b;

  padding:7px 10px;

  border-radius:999px;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.draft-status{

  display:inline-block;

  background:#1c2730;

  border:1px solid #3e6176;

  color:#8ccdf3;

  padding:7px 10px;

  border-radius:999px;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.locked{

  display:inline-block;

  padding:7px 10px;

  border-radius:999px;

  background:#202020;

  border:1px solid #555;

  color:#bbb;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

}

.info-row{

  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:9px 0;

  border-bottom:1px solid #333;

}

.info-row:last-child{

  border-bottom:none;

}

.system-note{

  border-left:4px solid #f3a51b;

  padding:12px 14px;

  background:#181818;

  margin-top:12px;

  color:#bbb;

}

.actions{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:15px;

}

.actions button{

  flex:1;

  min-width:150px;

}

.cart-count{

  display:inline-block;

  margin-left:8px;

  padding:4px 8px;

  border-radius:999px;

  background:#f3a51b;

  color:#111;

  font-size:11px;

  font-weight:bold;

}

@media(max-width:700px){

  .app{padding:16px}

  .grid{grid-template-columns:1fr}

  .order-top{flex-direction:column}

}

</style>

</head>

<body>

<div id="root"></div>

<script>

let loggedIn=false;

let orderType="";

let currentCategory="";

let currentQty=1;

let currentExtraQty={};

let currentDraftId=null;

let cart=[];

let customer={

  name:"",

  phone:"",

  address:"",

  table:""

};

let activeOrders=

  JSON.parse(localStorage.getItem("mrkActiveOrders") || "[]");

let draftOrders=

  JSON.parse(localStorage.getItem("mrkDraftOrders") || "[]");

let nextOrderNumber=

  Number(localStorage.getItem("mrkNextOrderNumber") || "1");

let timerInterval=null;

/* =========================

   MENU

========================= */

const burgers=[

  "Mr K Classic",

  "Mushroom & Swiss",

  "Honky Tonk",

  "Philly Cheesesteak",

  "Only The Brave",

  "Bohemian",

  "Chicken Chimichurri"

];

const sides=[

  "French Fries",

  "Plantain Tostones",

  "Onion Rings",

  "Cheese Fries",

  "Fajita Cheese Fries",

  "Dirty Fries"

];

const salads=[

  "Mr K Coleslaw",

  "Cheeseburger Salad"

];

const drinks=[

  "Small Water",

  "Big Water",

  "Coca Cola",

  "Sprite",

  "Fanta"

];

const sauces=[

  "Mr K Sauce",

  "Chimichurri",

  "Ketchup",

  "Mayonnaise",

  "Honey Mustard",

  "Honey BBQ"

];

const burgerDetails={

  "Mr K Classic":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Rocket lettuce",

      "Tomato",

      "Onions",

      "Pickled cucumbers",

      "Mr K sauce"

    ]

  },

  "Mushroom & Swiss":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Mushrooms",

      "Swiss cheese",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Honky Tonk":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Bacon",

      "Swiss cheese",

      "Cheddar cheese",

      "Rocket lettuce",

      "Sauce",

      "Onion rings"

    ]

  },

  "Philly Cheesesteak":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Mozzarella cheese",

      "Cheddar cheese",

      "Sautéed beef tenderloin 100g",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Only The Brave":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g ×3",

      "Burger bun",

      "Cheddar cheese ×3",

      "Bacon",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Bohemian":{

    meat:"beef",

    ingredients:[

      "Beef steak 120g",

      "Burger bun",

      "Mozzarella cheese",

      "Smoked turkey",

      "Rocket lettuce",

      "Sauce"

    ]

  },

  "Chicken Chimichurri":{

    meat:"chicken",

    ingredients:[

      "Chicken steak 120g",

      "Burger bun",

      "Mozzarella cheese",

      "Cheddar cheese",

      "Chimichurri",

      "Rocket lettuce",

      "Sauce"

    ]

  }

};

const beefExtras=[

  "Extra beef patty",

  "Extra cheddar cheese",

  "Extra mozzarella cheese",

  "Extra Swiss cheese",

  "Extra mushroom",

  "Extra onion rings",

  "Extra bacon"

];

const chickenExtras=[

  "Extra chicken steak",

  "Extra cheddar cheese",

  "Extra mozzarella cheese",

  "Extra Swiss cheese",

  "Extra mushroom",

  "Extra onion rings",

  "Extra bacon"

];

const loadedFries=[

  "Cheese Fries",

  "Fajita Cheese Fries",

  "Dirty Fries"

];

/* =========================

   HELPERS

========================= */

function escapeValue(value){

  return String(value || "")

    .replace(/&/g,"&amp;")

    .replace(/"/g,"&quot;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;");

}

function padOrder(number){

  return String(number).padStart(3,"0");

}

function orderLabel(order){

  if(order.type==="DINE IN"){

    return `Table ${order.customer.table}`;

  }

  return order.customer.name || order.type;

}

function currentCustomerLabel(){

  if(orderType==="DINE IN"){

    return `Table ${customer.table}`;

  }

  return customer.name;

}

/* =========================

   STORAGE

========================= */

function saveOrders(){

  localStorage.setItem(

    "mrkActiveOrders",

    JSON.stringify(activeOrders)

  );

  localStorage.setItem(

    "mrkDraftOrders",

    JSON.stringify(draftOrders)

  );

  localStorage.setItem(

    "mrkNextOrderNumber",

    String(nextOrderNumber)

  );

}

/* =========================

   LOGIN

========================= */

function render(){

  if(!loggedIn){

    document.getElementById("root").innerHTML=`

      <div class="login">

        <div class="loginbox">

          <div class="logo">

            MR K BURGERS

            <span>POS PROTOTYPE</span>

          </div>

          <div class="form" style="margin-top:30px">

            <label>Cashier ID</label>

            <input id="user" value="cashier01">

            <label>PIN</label>

            <input id="pin" type="password" value="1234">

            <button

              class="primary"

              onclick="login()"

            >

              LOGIN

            </button>

            <p class="muted">

              Prototype: cashier01 / 1234

            </p>

          </div>

        </div>

      </div>

    `;

    return;

  }

  home();

}

function login(){

  if(

    document.getElementById("user").value==="cashier01" &&

    document.getElementById("pin").value==="1234"

  ){

    loggedIn=true;

    render();

  }else{

    alert("Incorrect Cashier ID or PIN.");

  }

}

/* =========================

   HOME

========================= */

function home(){

  stopTimerRefresh();

  const newestOrders=

    [...activeOrders].sort(

      (a,b)=>b.number-a.number

    );

  document.getElementById("root").innerHTML=`

    <div class="app">

      <div class="logo">

        MR K BURGERS

        <span>CASHIER POS</span>

      </div>

      <div class="panel">

        <h1>Cashier Home</h1>

        <p class="muted">

          Ready to take the next order.

        </p>

        <button

          class="primary"

          onclick="newOrder()"

        >

          ＋ NEW ORDER

        </button>

      </div>

      <div class="grid">

        <div

          class="card clickable"

          onclick="showDraftOrders()"

        >

          <div class="badge">

            ORDERS IN PROGRESS

          </div>

          <h2>${draftOrders.length}</h2>

          <div class="muted">

            Tap to continue editable orders

          </div>

        </div>

        <div

          class="card clickable"

          onclick="showActiveOrders()"

        >

          <div class="badge">

            ACTIVE ORDERS

          </div>

          <h2>${activeOrders.length}</h2>

          <div class="muted">

            Tap to view kitchen orders

          </div>

        </div>

        <div class="card">

          <div class="badge">

            TODAY'S ORDERS

          </div>

          <h2>${activeOrders.length}</h2>

        </div>

      </div>

      ${

        newestOrders.length

        ?

        `

        <div class="panel">

          <div class="badge">

            LIVE KITCHEN ORDERS

          </div>

          <h2>Current Timers</h2>

          ${newestOrders.map(order=>`

            <div

              class="order-card clickable"

              onclick="viewActiveOrder(${order.id})"

            >

              <div class="order-top">

                <div>

                  <div class="order-number">

                    Order #${padOrder(order.number)}

                  </div>

                  <div class="muted">

                    ${orderLabel(order)} • ${order.type}

                  </div>

                </div>

                <div

                  class="timer"

                  data-start="${order.startedAt}"

                >

                  ${formatTimer(order.startedAt)}

                </div>

              </div>

              <div style="margin-top:12px">

                <span class="status">

                  ${order.status}

                </span>

                <span class="locked">

                  READ ONLY

                </span>

              </div>

            </div>

          `).join("")}

        </div>

        `

        :

        ""

      }

    </div>

  `;

  startTimerRefresh();

}

/* =========================

   NEW ORDER

========================= */

function resetCurrentOrder(){

  currentDraftId=null;

  orderType="";

  currentCategory="";

  currentQty=1;

  currentExtraQty={};

  cart=[];

  customer={

    name:"",

    phone:"",

    address:"",

    table:""

  };

}

function newOrder(){

  resetCurrentOrder();

  showOrderType();

}

function showOrderType(){

  stopTimerRefresh();

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="home()"

      >

        ← HOME

      </button>

      <div class="logo">

        MR K BURGERS

        <span>NEW ORDER</span>

      </div>

      <div class="panel">

        <h1>Select Order Type</h1>

        <div class="grid">

          <button

            class="category"

            onclick="selectOrderType('DINE IN')"

          >

            <div class="category-icon">🍽️</div>

            <div class="badge">ORDER TYPE</div>

            <h2>DINE IN</h2>

          </button>

          <button

            class="category"

            onclick="selectOrderType('TAKEAWAY')"

          >

            <div class="category-icon">🥡</div>

            <div class="badge">ORDER TYPE</div>

            <h2>TAKEAWAY</h2>

          </button>

          <button

            class="category"

            onclick="selectOrderType('DELIVERY')"

          >

            <div class="category-icon">🛵</div>

            <div class="badge">ORDER TYPE</div>

            <h2>DELIVERY</h2>

          </button>

        </div>

      </div>

    </div>

  `;

}

function selectOrderType(type){

  orderType=type;

  customerForm();

}

/* =========================

   CUSTOMER / TABLE

========================= */

function customerForm(){

  if(orderType==="DINE IN"){

    document.getElementById("root").innerHTML=`

      <div class="app">

        <button

          class="back"

          onclick="showOrderType()"

        >

          ← BACK

        </button>

        <div class="logo">

          MR K BURGERS

          <span>DINE IN</span>

        </div>

        <div class="panel">

          <h1>Table Number</h1>

          <div class="form">

            <label>Table Number *</label>

            <input

              id="tableNumber"

              inputmode="numeric"

              value="${escapeValue(customer.table)}"

              placeholder="Example: 6"

            >

            <button

              class="primary"

              onclick="saveCustomer()"

            >

              CONTINUE TO MENU

            </button>

          </div>

        </div>

      </div>

    `;

    return;

  }

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="showOrderType()"

      >

        ← BACK

      </button>

      <div class="logo">

        MR K BURGERS

        <span>${orderType}</span>

      </div>

      <div class="panel">

        <h1>Customer Details</h1>

        <div class="form">

          <label>Customer Name *</label>

          <input

            id="customerName"

            value="${escapeValue(customer.name)}"

            placeholder="Customer name"

          >

          <label>

            Phone

            ${orderType==="DELIVERY" ? "*" : "(optional)"}

          </label>

          <input

            id="customerPhone"

            value="${escapeValue(customer.phone)}"

            placeholder="+223..."

          >

          ${

            orderType==="DELIVERY"

            ?

            `

            <label>

              Delivery Address *

            </label>

            <input

              id="customerAddress"

              value="${escapeValue(customer.address)}"

              placeholder="Delivery address"

            >

            `

            :

            ""

          }

          <button

            class="primary"

            onclick="saveCustomer()"

          >

            CONTINUE TO MENU

          </button>

        </div>

      </div>

    </div>

  `;

}

function saveCustomer(){

  if(orderType==="DINE IN"){

    const table=

      document.getElementById("tableNumber").value.trim();

    if(!table){

      alert("Table number is required.");

      return;

    }

    customer={

      name:"",

      phone:"",

      address:"",

      table

    };

    showCategories();

    return;

  }

  const name=

    document.getElementById("customerName").value.trim();

  const phone=

    document.getElementById("customerPhone").value.trim();

  const address=

    orderType==="DELIVERY"

    ? document.getElementById("customerAddress").value.trim()

    : "";

  if(!name){

    alert("Customer name is required.");

    return;

  }

  if(orderType==="DELIVERY" && !phone){

    alert("Phone number is required for delivery.");

    return;

  }

  if(orderType==="DELIVERY" && !address){

    alert("Delivery address is required.");

    return;

  }

  customer={

    name,

    phone,

    address,

    table:""

  };

  showCategories();

}

/* =========================

   MENU CATEGORIES

========================= */

function showCategories(){

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="customerForm()"

      >

        ← ${orderType==="DINE IN" ? "TABLE" : "CUSTOMER"}

      </button>

      <div class="logo">

        MR K BURGERS

        <span>MENU</span>

      </div>

      <div class="panel">

        <div class="order-top">

          <div>

            <h1>Menu Categories</h1>

            <p class="muted">

              ${currentCustomerLabel()} · ${orderType}

            </p>

          </div>

          <button onclick="viewCart()">

            VIEW ORDER

            <span class="cart-count">

              ${cart.length}

            </span>

          </button>

        </div>

        <div class="grid">

          ${menuCategoryCard(

            "🍔",

            "Burgers",

            burgers.length

          )}

          ${menuCategoryCard(

            "🍟",

            "Sides",

            sides.length

          )}

          ${menuCategoryCard(

            "🥗",

            "Salads",

            salads.length

          )}

          ${menuCategoryCard(

            "🥤",

            "Soft Drinks",

            drinks.length

          )}

          ${menuCategoryCard(

            "🥫",

            "Extra Sauces",

            sauces.length

          )}

        </div>

        <div class="actions">

          <button

            class="secondary"

            onclick="saveAndHoldOrder()"

          >

            SAVE & HOLD ORDER

          </button>

          <button

            class="primary"

            onclick="viewCart()"

          >

            VIEW ORDER

          </button>

        </div>

      </div>

    </div>

  `;

}

function menuCategoryCard(icon,name,count){

  return `

    <button

      class="category"

      onclick='showCategory(${JSON.stringify(name)})'

    >

      <div class="category-icon">

        ${icon}

      </div>

      <div class="badge">

        CATEGORY

      </div>

      <h2>

        ${name}

      </h2>

      <p>

        ${count} items

      </p>

    </button>

  `;

}

/* =========================

   CATEGORY ITEMS

========================= */

function showCategory(category){

  currentCategory=category;

  let items=[];

  if(category==="Burgers") items=burgers;

  if(category==="Sides") items=sides;

  if(category==="Salads") items=salads;

  if(category==="Soft Drinks") items=drinks;

  if(category==="Extra Sauces") items=sauces;

  document.getElementById("root").innerHTML=`

    <div class="app">

      <button

        class="back"

        onclick="showCategories()"

      >

        ← CATEGORIES

      </button>

      <div class="logo">

        MR K BURGERS

        <span>${category}</span>

      </div>

      <div class="panel">

        <div class="order-top">

          <h1>${category}</h1>

          <button onclick="viewCart()">

            VIEW ORDER

            <span class="cart-count">

              ${cart.length}

            </span>

          </button>

        </div>

        <div class="grid">

          ${items.map(item=>`

            <button

              class="category"

              onclick='selectMenuItem(${JSON.stringify(item)})'

            >

              <div class="badge">

                ${category}

              </div>

              <h2>

                ${item}

              </h2>

            </button>

          `).join("")}

        </div>

      </div>

    </div>

  `;

}

function selectMenuItem(name){

  if(burgers.includes(name)){

    customizeBurger(name);

    return;

  }

  if(loadedFries.includes(name)){

    customizeLoadedFries(name);

    return;

  }

  simpleItem(name);

}

/* =========================

   EXTRA QUANTITY SYSTEM

========================= */

function resetExtras(extras){

  currentExtraQty={};

  extras.forEach(extra=>{

    currentExtraQty[extra]=0;

  });

}

function safeId(text){

  return text

    .replace(/[^a-zA-Z0-9]/g,"_");

}

function extraRows(extras){

  return extras.map(extra=>`

    <div class="extra-row">

      <div class="extra-name">

        ${extra}

      </div>

      <div class="extra-qty">

        <button

          onclick='changeExtraQty(${JSON.stringify(extra)},-1)'

        >

          −

        </button>

        <strong id="extra_${safeId(extra)}">

          ${currentExtraQty[extra] || 0}

        </strong>

        <button

          onclick='changeExtraQty(${JSON.stringify(extra)},1)'

        >

          +

        </button>

      </div>

    </div>

  `).join("");

}

function changeExtraQty(extra,change){

  currentExtraQty[extra]=

    Math.max(

      0,

      (currentExtraQty[extra] || 0)+change

    );

  const element=

    document.getElementById(

      "extra_"+safeId(extra)

    );

  if(element){

    element.textContent=

      currentExtraQty[extra];

  }

}

function addCustomizedItem(name){

          check.dataset.name

        );

      }

    Object.entries(currentExtraQty)

      .filter(([,qty])=>qty>0)

    name,

function saveAndHoldOrder(){

  if(!orderType){

    alert("Order type is required.");

    return;

  }

  if(orderType==="DINE IN" && !customer.table){

    alert("Table number is required.");

    return;

  }

  if(orderType!=="DINE IN" && !customer.name){

    alert("Customer details are required.");

    return;

  }

  const draft={

    id:

      currentDraftId ||

      Date.now(),

    type:orderType,

    customer:{

      name:customer.name,

      phone:customer.phone,

      address:customer.address,

      table:customer.table

    },

    items:

      JSON.parse(

        JSON.stringify(cart)

      ),

    savedAt:Date.now()

  };

  if(currentDraftId){

    const index=

      draftOrders.findIndex(

        order=>order.id===currentDraftId

      );

    if(index>=0){

      draftOrders[index]=draft;

    }else{

      draftOrders.push(draft);

    }

  }else{

    draftOrders.push(draft);

  }

  saveOrders();

  resetCurrentOrder();

  home();

}

function showDraftOrders(){

          </div>

          `

        }

      </div>

    </div>

  `;

}

function resumeDraftOrder(id){

  const draft=

    draftOrders.find(

      order=>order.id===id

    );

  if(!draft){

    return;

  }

  currentDraftId=draft.id;

  orderType=draft.type;

  customer={

    name:draft.customer.name || "",

    phone:draft.customer.phone || "",

    address:draft.customer.address || "",

    table:draft.customer.table || ""

  };

  cart=

    JSON.parse(

      JSON.stringify(draft.items)

    );

  showCategories();

}

function deleteDraftOrder(id){

  const draft=

    draftOrders.find(

      order=>order.id===id

    );

  if(!draft){

    return;

  }

  if(

    !confirm(

      `Delete the held order for ${orderLabel(draft)}?`

    )

  ){

    return;

  }

  draftOrders=

    draftOrders.filter(

      order=>order.id!==id

    );

  saveOrders();

  showDraftOrders();

}

function checkoutOrder(){

  if(!cart.length){

    alert("Add at least one item before checkout.");

    return;

  }

  const order={

    id:Date.now(),

    number:nextOrderNumber,

    type:orderType,

    customer:{

      name:customer.name,

      phone:customer.phone,

      address:customer.address,

      table:customer.table

    },

    items:

      JSON.parse(

        JSON.stringify(cart)

      ),

    status:"NEW",

    locked:true,

    startedAt:Date.now(),

    kitchenSent:true,

    receiptsQueued:2

  };

  activeOrders.push(order);

  nextOrderNumber++;

  if(currentDraftId){

    draftOrders=

      draftOrders.filter(

        draft=>draft.id!==currentDraftId

      );

  }

  saveOrders();

  resetCurrentOrder();

  checkoutSuccess(order);

}

/* =========================

   TIMER

========================= */

function formatTimer(startedAt){

  const seconds=

    Math.max(

      0,

      Math.floor(

        (Date.now()-startedAt)/1000

      )

    );

  const hours=

    Math.floor(seconds/3600);

  const minutes=

    Math.floor((seconds%3600)/60);

  const secs=

    seconds%60;

  if(hours>0){

    return (

      String(hours).padStart(2,"0")

      +":"

      +String(minutes).padStart(2,"0")

      +":"

      +String(secs).padStart(2,"0")

    );

  }

  return (

    String(minutes).padStart(2,"0")

    +":"

    +String(secs).padStart(2,"0")

  );

}

function updateVisibleTimers(){

  document

    .querySelectorAll(".timer[data-start]")

    .forEach(timer=>{

      timer.textContent=

        formatTimer(

          Number(timer.dataset.start)

        );

    });

}

function startTimerRefresh(){

  stopTimerRefresh();

  updateVisibleTimers();

  timerInterval=

    setInterval(

      updateVisibleTimers,

      1000

    );

}

function stopTimerRefresh(){

  if(timerInterval){

    clearInterval(timerInterval);

    timerInterval=null;

  }

}
